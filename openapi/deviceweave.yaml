openapi: 3.0.3

info:
  title: DeviceWeave API
  version: "1.0.0"
  description: |
    Natural-language home automation: an intent arrives as text or as a camera
    observation, gets resolved to a scene or a device, is checked against the
    policy engine, and is executed against a provider.

    `POST /mcp` is the remote MCP Streamable HTTP endpoint (protocol
    2025-06-18). `GET /mcp` returns 405. Both require a bearer token.

    **Resolving the server and the data stores.** Do not hardcode anything:

        aws cloudformation describe-stacks --stack-name deviceweave \
          --query "Stacks[0].Outputs"

    `scripts/stack_env.py` turns those outputs into environment variables —
    the API base URL, all five DynamoDB tables **and the two GSI names**. A
    table name alone does not let you query a table whose access pattern is an
    index: you either name the index or you scan.

    **503 means unconfigured, not down.** Several routes return 503 when the
    table they need has no environment variable set — learnings, presence and
    policies each do. A harness that treats 503 as a transient outage will
    retry forever against a stack that is simply missing a setting.

    `tests/test_openapi_contract.py` checks this file against the `Path:` and
    `Method:` entries in `template.yaml` in both directions, so it cannot
    document a route the gateway does not forward.

servers:
  - url: "{apiBaseUrl}"
    description: Resolved from the ApiBaseUrl stack output
    variables:
      apiBaseUrl:
        default: https://example.execute-api.us-east-1.amazonaws.com/prod
        description: The ApiBaseUrl output of the deviceweave stack

tags:
  - name: execution
    description: Turning an intent into a device action
  - name: devices
    description: The device registry, populated by provider ingestion
  - name: learning
    description: Phrase-to-device bindings
  - name: policy
    description: Natural-language rules compiled to a validated DSL
  - name: presence
    description: Home-occupancy state, consumed by the policy engine
  - name: mcp
    description: Remote MCP Streamable HTTP endpoint (protocol 2025-06-18)

paths:

  /health:
    get:
      tags: [execution]
      operationId: getHealth
      summary: Liveness, plus which subsystems are actually configured
      description: |
        Always 200. `registry_ok: false` with a `registry_error` means the
        device registry could not be read — the service is up and the catalog
        is empty, which is not the same thing and does not show in the status
        code.
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema:
                type: object
                required: [status, devices, registry_ok, scenes, learning_enabled, graph_enabled]
                properties:
                  status: { type: string, example: healthy }
                  devices: { type: integer, description: Active devices in the catalog }
                  registry_ok: { type: boolean }
                  registry_error:
                    type: string
                    description: Present only when registry_ok is false
                  scenes: { type: integer }
                  learning_enabled: { type: boolean, description: LEARNING_TABLE_NAME is set }
                  graph_enabled: { type: boolean }

  /execute:
    post:
      tags: [execution]
      operationId: execute
      summary: Execute an intent — one-shot, or a conversational turn
      description: |
        **Two modes, selected by the body, not by the path.** Supplying a
        non-empty `session_id` switches to the agentic loop with
        DynamoDB-persisted history and returns `{"type": "conversational", …}`.
        Without it, the request is one-shot: the command is matched against
        scenes first and falls through to single-device resolution.

        A one-shot intent can come from text (`command`) or from a camera
        (`source: "vision"` with an `observation`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                command: { type: string, description: The natural-language instruction }
                session_id:
                  type: string
                  description: Non-empty switches to conversational mode, where `command` is required
                source:
                  type: string
                  description: e.g. "vision" for a camera-derived intent
                observation:
                  type: object
                  description: Camera payload, when source is vision
                  additionalProperties: true
      responses:
        "200":
          description: Executed, or answered conversationally
          content:
            application/json:
              schema:
                type: object
                required: [type]
                additionalProperties: true
                properties:
                  type:
                    type: string
                    description: '"conversational" for session mode; otherwise the one-shot result kind'
                  session_id: { type: string, description: Conversational mode only }
                  response: { type: string, description: Conversational mode only }
                  messages_in_session: { type: integer, description: Conversational mode only }
        "400":
          description: Body is not JSON, no intent could be extracted, or conversational mode got an empty command
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502":
          description: The agent failed (conversational mode)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /providers:
    get:
      tags: [devices]
      operationId: listProviders
      responses:
        "200":
          description: Registered device providers
          content:
            application/json:
              schema:
                type: object
                required: [providers, count]
                properties:
                  providers: { type: array, items: { type: string } }
                  count: { type: integer }

  /ingest:
    post:
      tags: [devices]
      operationId: ingest
      summary: Sync devices from a provider into the registry
      description: |
        Returns **202** — the pipeline has run, but this is the only write path
        into the registry, so `GET /devices` reflects it only once the cache
        invalidates.

        Ring has a two-factor flow that arrives as a **200, not an error**:
        `{"status": "2fa_required"}` with the code sent by SMS, then the same
        call again with `two_fa_code`. A harness that only checks for 2xx will
        read "we texted you a code" as a successful sync.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                provider: { type: string, default: kasa }
                mode: { type: string, enum: [full, delta], default: delta }
                refresh_token: { type: string, description: Ring only }
                two_fa_code: { type: string, description: Ring only — the SMS code }
      responses:
        "200":
          description: Ring two-factor challenge — not a completed sync
          content:
            application/json:
              schema:
                type: object
                required: [status, message, next_step]
                properties:
                  status: { type: string, enum: [2fa_required, 2fa_code_invalid] }
                  message: { type: string }
                  next_step: { type: string, description: The exact call to make next }
        "202":
          description: The sync ran; the body is the pipeline's result
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "400":
          description: Unknown mode, or the pipeline rejected the request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502":
          description: The provider pipeline failed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /devices:
    get:
      tags: [devices]
      operationId: listDevices
      responses:
        "200":
          description: The active device catalog
          content:
            application/json:
              schema:
                type: object
                required: [devices, count]
                properties:
                  devices:
                    type: array
                    items: { $ref: "#/components/schemas/Device" }
                  count: { type: integer }
        "503": { $ref: "#/components/responses/RegistryUnavailable" }
    post:
      tags: [devices]
      operationId: createDeviceRejected
      summary: Always 405 — devices come from provider ingestion
      description: |
        API Gateway routes this, and the handler refuses it: devices are not
        created by hand, they are discovered. Use `POST /ingest`. It is
        documented because it is routed — a client that finds it and expects a
        create gets a 405 with the alternative in the message.
      responses:
        "405":
          description: '"Devices are managed via provider ingest. Use POST /ingest to sync."'
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /devices/{device_id}:
    parameters:
      - $ref: "#/components/parameters/DeviceId"
    get:
      tags: [devices]
      operationId: getDevice
      responses:
        "200":
          description: The device
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Device" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/RegistryUnavailable" }
    put:
      tags: [devices]
      operationId: updateDevice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: The updated device
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "400":
          description: Body is not valid JSON, or a field is unusable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/RegistryUnavailable" }
    delete:
      tags: [devices]
      operationId: deleteDevice
      summary: Deactivate a device
      description: |
        A soft delete: every registry row for the device is set to
        `status: inactive`. The rows stay, so a later ingest can revive the
        device rather than re-creating it.
      responses:
        "200":
          description: Deactivated
          content:
            application/json:
              schema:
                type: object
                required: [device_id, status, updated_at]
                properties:
                  device_id: { type: string }
                  status: { type: string, enum: [inactive] }
                  updated_at: { type: string, format: date-time }
        "404": { $ref: "#/components/responses/NotFound" }
        "500":
          description: The deactivation write failed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /scenes:
    get:
      tags: [execution]
      operationId: listScenes
      description: |
        The active catalog is the built-in `SCENE_CATALOG` minus anything
        deleted through `DELETE /scenes/{scene_id}`, so a scene that is gone
        here may still exist in the code.
      responses:
        "200":
          description: Active scenes
          content:
            application/json:
              schema:
                type: object
                required: [scenes, count]
                properties:
                  scenes:
                    type: array
                    items: { type: object, additionalProperties: true }
                  count: { type: integer }

  /scenes/{scene_id}:
    delete:
      tags: [execution]
      operationId: deleteScene
      parameters:
        - name: scene_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Removed from the active catalog
          content:
            application/json:
              schema:
                type: object
                required: [scene_id, status]
                properties:
                  scene_id: { type: string }
                  status: { type: string, enum: [deleted] }
        "404": { $ref: "#/components/responses/NotFound" }
        "500":
          description: The delete failed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /learn:
    post:
      tags: [learning]
      operationId: learnPhrase
      summary: Bind a phrase to a device
      description: |
        `persisted: false` in a 200 means the binding already existed, not that
        the write failed — the request succeeded either way.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device_id, phrase]
              properties:
                device_id: { type: string }
                phrase: { type: string, description: Lower-cased before storage }
      responses:
        "200":
          description: Learned
          content:
            application/json:
              schema:
                type: object
                required: [status, device_id, phrase, persisted]
                properties:
                  status: { type: string, enum: [learned] }
                  device_id: { type: string }
                  phrase: { type: string }
                  persisted: { type: boolean, description: false when the binding already existed }
        "400":
          description: Body is not JSON, or device_id/phrase is missing
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: The device_id is not in the active catalog; the error lists the known ids
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/StoreUnconfigured" }

  /learnings:
    get:
      tags: [learning]
      operationId: listLearnings
      description: |
        A full table scan, newest first, with no pagination — every binding is
        returned in one response.
      responses:
        "200":
          description: All phrase-to-device bindings
          content:
            application/json:
              schema:
                type: object
                required: [learnings, count]
                properties:
                  learnings:
                    type: array
                    items:
                      type: object
                      required: [device_id, phrase, source, confidence, use_count, created_at]
                      properties:
                        device_id: { type: string }
                        phrase: { type: string }
                        source: { type: string, default: learned }
                        confidence: { type: number }
                        use_count: { type: integer }
                        created_at: { type: string }
                  count: { type: integer }
        "500":
          description: The scan failed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/StoreUnconfigured" }
    delete:
      tags: [learning]
      operationId: deleteLearning
      summary: Remove one phrase-to-device binding
      description: |
        Identified by a **request body**, not a path parameter, because the key
        is the (device_id, phrase) pair. Idempotent: deleting a binding that
        does not exist is a 200 with `deleted: true`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device_id, phrase]
              properties:
                device_id: { type: string }
                phrase: { type: string }
      responses:
        "200":
          description: Gone (or never present)
          content:
            application/json:
              schema:
                type: object
                required: [device_id, phrase, deleted]
                properties:
                  device_id: { type: string }
                  phrase: { type: string }
                  deleted: { type: boolean }
        "400":
          description: Body is not JSON, or device_id/phrase is missing
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: The delete failed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/StoreUnconfigured" }

  /presence:
    get:
      tags: [presence]
      operationId: getPresence
      description: |
        Defaults to `is_home: true` with a null `updated_at` and
        `freshness: unknown` when nothing has ever been written — the policy
        engine gets the safe answer rather than an error, so a null
        `updated_at` is the only way to tell "nobody has set this" from
        "someone set it to true".

        When the eero poller has run, `zone` / `node` name the eero node the
        person is on, `signal` is the connection quality, `room` is the
        calibrated room or `unknown`, `room_confidence` is that classification,
        `last_seen` is the client's last-active time, and `freshness` is
        `fresh` or `stale`. `stale` means the last poll could not trust eero;
        `is_home` is the previous value and nobody was marked away because
        the poll failed. `room` stays `unknown` when the classifier will not
        name a room. `zone` remains the node-level location either way.
      responses:
        "200":
          description: Current occupancy state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Presence" }
        "500":
          description: The read failed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/StoreUnconfigured" }
    post:
      tags: [presence]
      operationId: setPresence
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [is_home]
              properties:
                is_home:
                  type: boolean
                  description: Must be a real boolean — "true" as a string is a 400
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Presence" }
        "400":
          description: Body is not JSON, is_home missing, or is_home is not a boolean
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: The write failed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/StoreUnconfigured" }

  /presence/rooms/calibrate:
    post:
      tags: [presence]
      operationId: calibrateRoom
      summary: Start room calibration
      description: |
        Raja stands in one room. This records N on-demand eero reads
        (about every 12 seconds) and stores them as that room's fingerprint:
        node, coarse signal bucket, and time. `samples` defaults to 5 and
        is capped at 8. Calling it again for the same person and room
        replaces that room's samples.

        The minute of reads does not fit in an HTTP integration, so this
        returns **202** once sampling has been queued. `GET /presence/rooms`
        shows the stored samples after it finishes. A failed run leaves the
        previous samples in place.

        Requires the same bearer token as `POST /mcp`. There is no
        unauthenticated route to the fingerprint table.
      security:
        - mcpBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [person, room]
              properties:
                person:
                  type: string
                  description: Person name, matching the tracked-device mapping
                room:
                  type: string
                  description: Room label. 1-40 letters, digits, spaces, hyphens, or underscores. `unknown` is reserved.
                samples:
                  type: integer
                  minimum: 1
                  maximum: 8
                  description: How many eero reads to take. Defaults to 5.
      responses:
        "202":
          description: Sampling started
          content:
            application/json:
              schema:
                type: object
                required: [status, person, room, samples, interval_seconds]
                properties:
                  status: { type: string, enum: [started] }
                  person: { type: string }
                  room: { type: string }
                  samples: { type: integer }
                  interval_seconds: { type: number }
        "400":
          description: Invalid room, person, or sample count, or the person is not tracked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Missing or wrong bearer token
        "502":
          description: Sampling could not be queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: Fingerprint table or a required secret is not configured
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /presence/rooms:
    get:
      tags: [presence]
      operationId: listRoomFingerprints
      summary: List calibrated room fingerprints
      description: |
        Rooms and their samples (node, coarse signal bucket, time). Optional
        `person` query filters to one person. Device identifiers are not
        returned. Requires the same bearer token as `POST /mcp`.
      security:
        - mcpBearer: []
      parameters:
        - name: person
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Stored fingerprints
          content:
            application/json:
              schema:
                type: object
                required: [rooms]
                properties:
                  rooms:
                    type: array
                    items:
                      type: object
                      properties:
                        person: { type: string }
                        room: { type: string }
                        sample_count: { type: integer }
                        nodes: { type: array, items: { type: string } }
                        buckets: { type: array, items: { type: integer } }
                        updated_at: { type: string }
                        samples:
                          type: array
                          items:
                            type: object
                            properties:
                              node: { type: string }
                              bucket: { type: integer }
                              signal: { type: string }
                              taken_at: { type: string }
        "401":
          description: Missing or wrong bearer token
        "503":
          description: Fingerprint table is not configured
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /presence/rooms/{room}:
    delete:
      tags: [presence]
      operationId: deleteRoomFingerprint
      summary: Delete a room fingerprint
      description: |
        Deletes the samples stored for `room`. Optional `person` limits the
        delete to that person; omitting it deletes that room label for every
        person. Requires the same bearer token as `POST /mcp`.
      security:
        - mcpBearer: []
      parameters:
        - name: room
          in: path
          required: true
          schema: { type: string }
        - name: person
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Deleted count. Zero when the room had no samples.
          content:
            application/json:
              schema:
                type: object
                required: [room, deleted]
                properties:
                  room: { type: string }
                  deleted: { type: integer }
        "400":
          description: Room label is not valid
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Missing or wrong bearer token
        "503":
          description: Fingerprint table is not configured
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /presence/checkins:
    post:
      tags: [presence]
      operationId: recordRoomCheckin
      summary: Record a labeled room check-in
      description: |
        Stores one training row in DeviceWeave. The server reads the current
        eero snapshot for the person's tracked device and saves it with the
        room label, `asked_at`, `answered_at`, and America/Chicago hour and
        weekday (Monday is 0). `room` may be `Not home` or any other label
        of 1-80 characters. The eero reading is taken now; pass `asked_at`
        only when this call is the question. Device ids are HMAC hashes.
        Requires the same bearer token as `POST /mcp`.
      security:
        - mcpBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [person, room]
              properties:
                person: { type: string }
                room: { type: string }
                asked_at: { type: string, description: ISO-8601. Defaults to now. }
                source: { type: string }
      responses:
        "200":
          description: Stored check-in. Numbers are JSON numbers.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoomCheckin" }
        "400":
          description: Invalid label, or the person is not tracked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Missing or wrong bearer token
        "500":
          description: The check-in could not be stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: Check-in table is not configured
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    get:
      tags: [presence]
      operationId: listRoomCheckins
      summary: List room check-ins
      description: |
        Lists check-ins stored in DeviceWeave, oldest first. Optional
        `person`, `since` (ISO-8601), and `limit` (1-200, default 50).
        Requires the same bearer token as `POST /mcp`.
      security:
        - mcpBearer: []
      parameters:
        - name: person
          in: query
          schema: { type: string }
        - name: since
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200 }
      responses:
        "200":
          description: Check-ins
          content:
            application/json:
              schema:
                type: object
                required: [checkins]
                properties:
                  checkins:
                    type: array
                    items: { $ref: "#/components/schemas/RoomCheckin" }
        "400":
          description: Invalid filter
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Missing or wrong bearer token
        "503":
          description: Check-in table is not configured
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /presence/checkins/capture:
    post:
      tags: [presence]
      operationId: captureRoomReading
      summary: Snapshot eero without a room label
      description: |
        Reads eero now and stores an unlabeled check-in. Returns `checkin_id`.
        Call `POST /presence/checkins/{checkin_id}/label` when the answer
        arrives. Requires the same bearer token as `POST /mcp`.
      security:
        - mcpBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [person]
              properties:
                person: { type: string }
                asked_at: { type: string }
                source: { type: string }
      responses:
        "200":
          description: Stored snapshot, including checkin_id
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoomCheckin" }
        "400":
          description: Invalid person, or the person is not tracked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Missing or wrong bearer token
        "503":
          description: Check-in table is not configured
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /presence/checkins/{checkin_id}/label:
    post:
      tags: [presence]
      operationId: labelRoomCheckin
      summary: Attach a room label to a captured check-in
      description: |
        Sets the room and `answered_at`. Does not read eero again, so the
        stored signal stays the ask-time snapshot. Requires the same bearer
        token as `POST /mcp`.
      security:
        - mcpBearer: []
      parameters:
        - name: checkin_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [room]
              properties:
                room: { type: string }
      responses:
        "200":
          description: Updated check-in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoomCheckin" }
        "400":
          description: Invalid id or room
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Missing or wrong bearer token
        "404":
          description: No check-in with that id
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: Check-in table is not configured
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /presence/checkins/{checkin_id}:
    delete:
      tags: [presence]
      operationId: deleteRoomCheckin
      summary: Delete a room check-in
      description: |
        Deletes one check-in. `deleted` is 0 when the id is already gone.
        Requires the same bearer token as `POST /mcp`.
      security:
        - mcpBearer: []
      parameters:
        - name: checkin_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Deleted count
          content:
            application/json:
              schema:
                type: object
                required: [checkin_id, deleted]
                properties:
                  checkin_id: { type: string }
                  deleted: { type: integer }
        "400":
          description: Invalid id
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Missing or wrong bearer token
        "503":
          description: Check-in table is not configured
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /presence/schedule:
    post:
      tags: [presence]
      operationId: setRoomScheduleRule
      summary: Set a fixed local-time room rule
      description: |
        Stores one window. While that person is home inside it, the poller
        sets the room with high confidence and `room_source` `schedule_rule`,
        and writes one labeled check-in per local hour. `end` earlier than
        `start` wraps midnight. `timezone` defaults to `America/Chicago`.
        Requires the same bearer token as `POST /mcp`.
      security:
        - mcpBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [person, room, start, end]
              properties:
                person: { type: string }
                room: { type: string }
                start: { type: string, description: "HH:MM, 24-hour, inclusive." }
                end: { type: string, description: "HH:MM, 24-hour, exclusive." }
                timezone: { type: string, description: "IANA name. Defaults to America/Chicago." }
      responses:
        "200":
          description: Stored rule
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoomScheduleRule" }
        "400":
          description: Invalid window, or it overlaps another rule for this person
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Missing or wrong bearer token
        "503":
          description: Schedule table is not configured
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    get:
      tags: [presence]
      operationId: listRoomScheduleRules
      summary: List room schedule rules
      description: |
        Lists fixed time-window rules. Optional `person` filter.
        Requires the same bearer token as `POST /mcp`.
      security:
        - mcpBearer: []
      parameters:
        - name: person
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Rules
          content:
            application/json:
              schema:
                type: object
                required: [rules]
                properties:
                  rules:
                    type: array
                    items: { $ref: "#/components/schemas/RoomScheduleRule" }
        "401":
          description: Missing or wrong bearer token
        "503":
          description: Schedule table is not configured
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /presence/schedule/{rule_id}:
    delete:
      tags: [presence]
      operationId: deleteRoomScheduleRule
      summary: Delete a room schedule rule
      description: |
        Deletes one rule. `deleted` is 0 when the id is already gone.
        Requires the same bearer token as `POST /mcp`.
      security:
        - mcpBearer: []
      parameters:
        - name: rule_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Deleted count
          content:
            application/json:
              schema:
                type: object
                required: [rule_id, deleted]
                properties:
                  rule_id: { type: string }
                  deleted: { type: integer }
        "400":
          description: Invalid id
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Missing or wrong bearer token
        "503":
          description: Schedule table is not configured
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /policies/author:
    post:
      tags: [policy]
      operationId: authorPolicy
      summary: Compile a natural-language rule into a validated policy
      description: |
        Three stages, and the status code says which one stopped: an LLM
        infrastructure failure is a **502** (retryable), a rule the validator
        rejects is a **422** (not retryable — the rule itself is the problem),
        and a storage failure is a 500. The 422 body carries
        `rejection_stage`, the confidence threshold, and the LLM's raw output,
        so a rejection can be diagnosed without re-running the compile.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rule]
              properties:
                rule: { type: string, description: The rule in plain language }
      responses:
        "201":
          description: |
            Compiled, validated and stored. `analysis` lists what the rule-set
            checker found when the rule was added beside the device's active
            policies — overlaps where a block overrides this allow, modifiers
            that disagree, a rule that adds nothing — each with a witness
            context. Only warnings and info reach a 201; an error is a 422.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Policy"
                  - type: object
                    properties:
                      analysis:
                        type: array
                        items: { $ref: "#/components/schemas/RuleSetFinding" }
        "400":
          description: Body is not JSON, or rule is missing/empty
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: The compiled rule failed validation
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - type: object
                    properties:
                      rule: { type: string }
                      rejection_stage: { type: string, enum: [validation, rule_set_analysis] }
                      confidence_threshold: { type: number }
                      llm_raw_output:
                        description: What the compiler produced, so the rejection can be diagnosed
                        type: object
                        additionalProperties: true
                      analysis:
                        description: Present when rejection_stage is rule_set_analysis
                        type: array
                        items: { $ref: "#/components/schemas/RuleSetFinding" }
        "500":
          description: Persisting the policy failed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502":
          description: The LLM compiler failed for infrastructure reasons — retry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/PolicyStoreUnconfigured" }

  /policies:
    get:
      tags: [policy]
      operationId: listPolicies
      description: |
        Filtering by `device_type` uses the `device-type-created-index` GSI,
        published as the `PolicyTableDeviceTypeCreatedIndex` stack output.
      parameters:
        - name: device_type
          in: query
          schema: { type: string }
        - name: limit
          in: query
          description: Capped at 100; a non-numeric value falls back to 50 rather than erroring
          schema: { type: integer, default: 50, maximum: 100 }
      responses:
        "200":
          description: Active policies
          content:
            application/json:
              schema:
                type: object
                required: [policies, count]
                properties:
                  policies:
                    type: array
                    items: { $ref: "#/components/schemas/Policy" }
                  count: { type: integer }
                  filter:
                    type: object
                    description: Echoed only when device_type was supplied
                    properties:
                      device_type: { type: string }
        "503": { $ref: "#/components/responses/PolicyStoreUnconfigured" }

  /policies/{rule_id}:
    parameters:
      - name: rule_id
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [policy]
      operationId: getPolicy
      description: |
        Returns the latest version unless `?version=` names one. The table is
        keyed (rule_id, version), so every version is retained.
      parameters:
        - name: version
          in: query
          description: A non-numeric value is ignored and the latest is returned
          schema: { type: integer }
      responses:
        "200":
          description: The policy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Policy" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/PolicyStoreUnconfigured" }
    delete:
      tags: [policy]
      operationId: deactivatePolicy
      summary: Deactivate a policy
      description: |
        A soft delete — the version history stays. Deactivating an
        already-inactive policy is a 404, so this is not idempotent.
      responses:
        "200":
          description: Deactivated
          content:
            application/json:
              schema:
                type: object
                required: [rule_id, status]
                properties:
                  rule_id: { type: string }
                  status: { type: string, enum: [inactive] }
        "404":
          description: No such policy, or it is already inactive
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/PolicyStoreUnconfigured" }

  /mcp:
    post:
      tags: [mcp]
      operationId: mcpPost
      summary: MCP Streamable HTTP JSON-RPC
      description: |
        One JSON-RPC 2.0 message per request, protocol `2025-06-18`.
        Methods: `initialize`, `tools/list`, and `tools/call`.
        Notifications (no `id`), including `notifications/initialized`,
        are answered with `202` and an empty body. JSON-RPC batches are
        rejected with `400`.

        Requires `Authorization: Bearer <token>`. The token is the
        SecretString of the Secrets Manager secret named by the
        `McpAuthTokenSecretName` stack parameter. A missing or wrong
        token is `401` with a JSON-RPC error body. The comparison is
        constant-time. Existing REST routes are unchanged and do not use
        this token.
      security:
        - mcpBearer: []
      parameters:
        - in: header
          name: MCP-Protocol-Version
          required: false
          schema:
            type: string
            example: "2025-06-18"
          description: Protocol version. `2025-06-18` or `2025-03-26`. Omit on initialize.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [jsonrpc, method]
              properties:
                jsonrpc:
                  type: string
                  enum: ["2.0"]
                id: {}
                method:
                  type: string
                params:
                  type: object
                  additionalProperties: true
      responses:
        "200":
          description: JSON-RPC result, or a JSON-RPC error for a well-formed request
          content:
            application/json:
              schema:
                type: object
                required: [jsonrpc]
                properties:
                  jsonrpc:
                    type: string
                    enum: ["2.0"]
                  id: {}
                  result:
                    type: object
                    additionalProperties: true
                  error:
                    type: object
                    required: [code, message]
                    properties:
                      code:
                        type: integer
                      message:
                        type: string
        "202":
          description: Accepted notification or client response. Empty body.
        "400":
          description: Parse error, invalid JSON-RPC, unsupported protocol version, or a JSON-RPC batch
        "401":
          description: Missing or wrong bearer token
          content:
            application/json:
              schema:
                type: object
                required: [jsonrpc, error]
                properties:
                  jsonrpc:
                    type: string
                  id: {}
                  error:
                    type: object
                    required: [code, message]
                    properties:
                      code:
                        type: integer
                        example: -32001
                      message:
                        type: string
                        example: Unauthorized
        "500":
          description: The auth-token secret could not be read
    get:
      tags: [mcp]
      operationId: mcpGet
      summary: SSE stream is not offered
      description: |
        Streamable HTTP allows GET /mcp to open a server-sent event stream.
        This server does not offer one and returns 405. POST /mcp is how
        clients send JSON-RPC. The bearer token is required here too; a
        missing or wrong token is 401 before the 405.
      security:
        - mcpBearer: []
      responses:
        "401":
          description: Missing or wrong bearer token
        "405":
          description: No SSE stream on this endpoint
          headers:
            Allow:
              schema:
                type: string
                example: POST

components:

  securitySchemes:
    mcpBearer:
      type: http
      scheme: bearer
      description: >
        SecretString of the Secrets Manager secret named by the
        McpAuthTokenSecretName template parameter.

  parameters:
    DeviceId:
      name: device_id
      in: path
      required: true
      schema: { type: string }

  responses:
    NotFound:
      description: No such resource
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

    RegistryUnavailable:
      description: |
        The device registry could not be read. Configuration or a DynamoDB
        failure — not a transient overload, so retrying does not help.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

    StoreUnconfigured:
      description: |
        LEARNING_TABLE_NAME or PRESENCE_TABLE_NAME is not set on the Lambda.
        Unconfigured, not down: retrying will never succeed.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

    PolicyStoreUnconfigured:
      description: POLICY_TABLE_NAME is not set on the Lambda. Unconfigured, not down.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    RuleSetFinding:
      type: object
      required: [kind, severity, rule_ids, device_type, message]
      properties:
        kind:
          type: string
          enum: [unsatisfiable, shadowed, conflict_block_allow, conflict_modify, redundant, invariant_violated, enforceability]
        severity: { type: string, enum: [error, warning, info] }
        rule_ids: { type: array, items: { type: string } }
        device_type: { type: string }
        message: { type: string }
        witness:
          type: object
          description: >
            A context in which the finding is true. For kind enforceability the
            object has exactly three fields: classification (GUARD_ENFORCEABLE,
            NEEDS_OBLIGATION, UNENFORCEABLE, or not_computed), counts (summary
            integers such as states, bad, reachable, disabled, forcing_states;
            or estimated_states and state_cap when not_computed), and trace
            (one shortest replayable path; empty when not_computed). The
            supervisor listing is not part of this response. Evaluate a flat
            context witness against the rules to see a conflict. An
            enforceability trace is replayed on the controllability plant.
          additionalProperties: true
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }

    RoomCheckin:
      type: object
      required: [checkin_id, person, source, asked_at, timezone, local_hour, weekday, freshness]
      properties:
        checkin_id:
          type: string
          description: Opaque id. person and sort key, so a later label does not need a second index.
        person: { type: string }
        room:
          type: string
          description: Room label, including Not home. Absent until the check-in is labeled.
        source: { type: string }
        asked_at:
          type: string
          format: date-time
          description: When the question was asked. Hour and weekday are this instant in America/Chicago.
        answered_at:
          type: string
          format: date-time
          description: When the room label was stored. Absent on an unlabeled capture.
        timezone:
          type: string
          enum: ["America/Chicago"]
        local_hour:
          type: integer
          minimum: 0
          maximum: 23
        weekday:
          type: integer
          minimum: 0
          maximum: 6
          description: Monday is 0. Taken from asked_at in America/Chicago.
        device_hmac:
          type: string
          description: HMAC-SHA256 of the tracked device id. Never a MAC address.
        node: { type: string }
        signal: { type: string }
        signal_bucket:
          type: integer
          minimum: 1
          maximum: 5
        freshness:
          type: string
          enum: [fresh, stale]
        last_seen: { type: string }
        is_home:
          type: boolean
          description: Omitted when eero could not be read, so a failed poll is not trained as away.

    RoomScheduleRule:
      type: object
      required: [rule_id, person, room, start, end, timezone]
      properties:
        rule_id: { type: string }
        person: { type: string }
        room: { type: string }
        start: { type: string, description: "HH:MM, inclusive." }
        end: { type: string, description: "HH:MM, exclusive. Earlier than start wraps midnight." }
        timezone: { type: string }

    Presence:
      type: object
      required: [is_home, updated_at]
      properties:
        is_home: { type: boolean }
        updated_at:
          type: string
          format: date-time
          nullable: true
          description: null when occupancy has never been written
        zone:
          type: string
          nullable: true
          description: Coarse room — the eero node's location, or its name when location is unset
        node:
          type: string
          nullable: true
          description: Eero node display name the matched device is connected to
        signal:
          type: string
          nullable: true
          description: Connection quality reported by eero (for example strong, or a bar count)
        room:
          type: string
          description: Calibrated room, or unknown when the classifier will not name one
        room_confidence:
          type: number
          minimum: 0
          maximum: 1
          description: Confidence of room. Zero when room is unknown.
        room_source:
          type: string
          enum: [schedule_rule]
          description: Present when a fixed time-window rule set the room.
        last_seen:
          type: string
          nullable: true
          description: When eero last reported the matched client active
        freshness:
          type: string
          enum: [fresh, stale, unknown]
          description: fresh after a trusted poll or manual write; stale when the last poll failed; unknown when never written
        source:
          type: string
          nullable: true
          enum: [eero, manual]
        stale_reason:
          type: string
          description: Present when freshness is stale
        people:
          type: array
          items:
            type: object
            properties:
              person: { type: string }
              is_home: { type: boolean }
              zone: { type: string, nullable: true }
              node: { type: string, nullable: true }
              signal: { type: string, nullable: true }
              room: { type: string }
              room_confidence: { type: number }
              room_source:
                type: string
                enum: [schedule_rule]
              last_seen: { type: string, nullable: true }
              freshness: { type: string }
              miss_count:
                type: integer
                description: Consecutive polls that missed every device mapped to this person

    Device:
      type: object
      description: The public view of a registry row; providers add their own fields.
      additionalProperties: true
      properties:
        id: { type: string }
        name: { type: string }
        provider: { type: string, description: Registry sort key — one device can have rows per provider }
        status: { type: string, enum: [active, inactive] }
        type: { type: string }

    Policy:
      type: object
      description: A compiled, validated policy rule. Keyed (rule_id, version).
      additionalProperties: true
      properties:
        rule_id: { type: string }
        version: { type: integer }
        device_type: { type: string, description: Partition key of device-type-created-index }
        created_at: { type: string, description: Sort key of device-type-created-index }
        confidence: { type: number }
        status: { type: string, enum: [active, inactive] }
