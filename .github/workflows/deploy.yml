name: DeviceWeave — SAM Deploy

on:
  push:
    branches:
      - main
  # Pull requests run every check except the deploy, so a PR is tested
  # before it merges rather than after.
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      stage:
        description: "Deployment stage"
        required: true
        default: prod
        type: choice
        options:
          - prod
          - staging
          - dev

# Prevent concurrent deploys to the same stage.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Known-vulnerable dependencies block the deploy, like a red test. Every
  # ignored advisory is listed here with the reason it does not apply.
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pip-audit
        run: |
          # PYSEC-2026-4114: oauthlib server-side PKCE timing leak (token endpoint); DeviceWeave only uses oauthlib as a client through ring-doorbell, which pins oauthlib<4 so the 4.0.0 fix cannot be installed
          python -m pip install pip-audit
          pip-audit -r src/requirements.txt --progress-spinner off --ignore-vuln PYSEC-2026-4114

  # Committed credentials block the deploy, like a known-vulnerable
  # dependency. gitleaks scans the full git history, not just HEAD, because a
  # secret removed in a later commit is still published. The binary is a
  # pinned release checked against its sha256 (not gitleaks-action, which
  # needs a license key for org accounts). Every allowlisted finding is in
  # .gitleaks.toml with the reason it is not a secret.
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: 8.28.0
      GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLo "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks
      - name: gitleaks (full history)
        run: |
          "$RUNNER_TEMP/gitleaks" version
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --exit-code 1 .

  # The suite runs offline (tests/conftest.py stubs AWS, Memgraph and the
  # network), so it gates every deploy: a red suite never ships.
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest

  deploy:
    name: Build & Deploy via AWS SAM
    needs: [test, audit, secrets]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # ----------------------------------------------------------------
    # OIDC permissions — id-token:write lets the runner request a JWT
    # from GitHub's OIDC provider, which AWS STS exchanges for temporary
    # credentials via AssumeRoleWithWebIdentity.
    # ----------------------------------------------------------------
    permissions:
      id-token: write
      contents: read

    env:
      STAGE: ${{ github.event.inputs.stage || 'prod' }}
      STACK_NAME: deviceweave-${{ github.event.inputs.stage || 'prod' }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      ASSUME_ROLE_ARN: arn:aws:iam::239571291755:role/teamweave-github-actions-sam-deployer
      # Cross-stack source names (override via repo secrets if they differ per env)
      SHARED_STACK_NAME: ${{ secrets.SHARED_STACK_NAME || 'tarun-teamweave-shared' }}
      MEMGRAPH_STACK_NAME: ${{ secrets.MEMGRAPH_STACK_NAME || 'contextweave-rag-prod' }}
      # CipherWeave token issuer. The JWKS URL is read from this stack.
      CIPHERWEAVE_STACK_NAME: ${{ vars.CIPHERWEAVE_STACK_NAME || 'cipherweave-prod' }}
      # Legacy static bearer token on /mcp during the move to CipherWeave
      # tokens. A repository *variable*, not a dispatch input, so that once
      # the owner sets it to false a later push cannot turn it back on.
      ACCEPT_LEGACY_TOKEN: ${{ vars.ACCEPT_LEGACY_TOKEN || 'true' }}
      # Per-tool scopes on /mcp. 'audit' only while existing clients are being
      # granted scopes (issuer_admin.py set-scopes); anything else enforces.
      # Step-up for destructive tools and unlock/open is on in both modes.
      TOOL_SCOPE_MODE: ${{ vars.TOOL_SCOPE_MODE || 'enforce' }}
      # REST routes take the /mcp credential; audit only while REST clients
      # are given a token (destructive routes are enforced either way).
      REST_AUTH_MODE: ${{ vars.REST_AUTH_MODE || 'enforce' }}

    steps:
      # ----------------------------------------------------------------
      # 1. Checkout
      # ----------------------------------------------------------------
      - name: Checkout source
        uses: actions/checkout@v4

      # ----------------------------------------------------------------
      # 2. Python — must match Lambda runtime declared in template.yaml
      # ----------------------------------------------------------------
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ----------------------------------------------------------------
      # 3. Install AWS SAM CLI
      # ----------------------------------------------------------------
      - name: Install AWS SAM CLI
        run: |
          pip install --upgrade pip
          pip install aws-sam-cli==1.121.0

      - name: Verify SAM CLI version
        run: sam --version

      # ----------------------------------------------------------------
      # 4. Assume IAM role via GitHub OIDC
      # ----------------------------------------------------------------
      - name: Assume deployer role via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ASSUME_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-DeviceWeave-${{ github.run_id }}

      # ----------------------------------------------------------------
      # 5. Resolve VPC parameters from shared infrastructure stack
      #
      #    Stack: tarun-teamweave-shared  (or SHARED_STACK_NAME secret)
      #    Outputs consumed:
      #      LambdaSubnetIds  — comma-separated private subnet IDs
      #
      #    VpcId is derived from the first subnet via EC2 DescribeSubnets
      #    (the shared stack does not export VpcId directly).
      # ----------------------------------------------------------------
      - name: Resolve VPC parameters from shared stack
        id: vpc
        run: |
          SUBNET_IDS=$(aws cloudformation describe-stacks \
            --stack-name "$SHARED_STACK_NAME" \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='LambdaSubnetIds'].OutputValue" \
            --output text)

          if [ -z "$SUBNET_IDS" ] || [ "$SUBNET_IDS" = "None" ]; then
            echo "ERROR: Could not resolve LambdaSubnetIds from stack $SHARED_STACK_NAME"
            exit 1
          fi

          # Derive VPC ID from the first subnet
          FIRST_SUBNET=$(echo "$SUBNET_IDS" | cut -d',' -f1 | tr -d ' ')
          VPC_ID=$(aws ec2 describe-subnets \
            --subnet-ids "$FIRST_SUBNET" \
            --region "$AWS_REGION" \
            --query "Subnets[0].VpcId" \
            --output text)

          if [ -z "$VPC_ID" ] || [ "$VPC_ID" = "None" ]; then
            echo "ERROR: Could not derive VpcId from subnet $FIRST_SUBNET"
            exit 1
          fi

          echo "vpc_id=$VPC_ID"           >> "$GITHUB_OUTPUT"
          echo "subnet_ids=$SUBNET_IDS"   >> "$GITHUB_OUTPUT"

          echo "Resolved VpcId=$VPC_ID from subnets=$SUBNET_IDS"

      # ----------------------------------------------------------------
      # 5b. Can the Lambdas be dual-stack?
      #
      #     Ipv6AllowedForDualStack is rejected unless every subnet the
      #     function is placed in has an IPv6 CIDR. Functions stay in the
      #     private LambdaSubnetIds — do not discover or check public
      #     subnets. Public subnets have no DynamoDB/AWS-service egress
      #     and need NAT or endpoints (a Lambda ENI gets no public IP, and
      #     the DynamoDB gateway endpoint is on the private route table).
      #     The association's state lives at Ipv6CidrBlockState.State --
      #     a top-level State filter matches nothing and would silently
      #     report "no IPv6".
      # ----------------------------------------------------------------
      - name: Check private subnets for IPv6 (Lambda dual-stack)
        id: dualstack
        run: |
          SUBNETS="${{ steps.vpc.outputs.subnet_ids }}"

          MISSING=""
          for SUBNET in $(echo "$SUBNETS" | tr ',' ' '); do
            CIDR=$(aws ec2 describe-subnets \
              --subnet-ids "$SUBNET" \
              --region "$AWS_REGION" \
              --query "Subnets[0].Ipv6CidrBlockAssociationSet[?Ipv6CidrBlockState.State=='associated'] | [0].Ipv6CidrBlock" \
              --output text)
            if [ -z "$CIDR" ] || [ "$CIDR" = "None" ]; then
              MISSING="$MISSING $SUBNET"
            fi
          done

          if [ -z "$MISSING" ]; then
            echo "dual_stack=true" >> "$GITHUB_OUTPUT"
            echo "All Lambda subnets have IPv6 -- deploying Lambdas dual-stack"
          else
            echo "dual_stack=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Lambdas deployed IPv4-only: no associated IPv6 CIDR on subnet(s):$MISSING"
          fi

      # ----------------------------------------------------------------
      # 6. Resolve Observatory metrics table parameters from shared stack
      #
      #    Stack: tarun-teamweave-shared
      #    Outputs consumed:
      #      ObservatoryMetricsTableName  — DynamoDB table name
      #      ObservatoryMetricsTableArn   — DynamoDB table ARN
      #
      #    Failure is non-fatal — observability is optional.
      # ----------------------------------------------------------------
      - name: Resolve Observatory metrics table from shared stack
        id: observatory
        run: |
          TABLE_NAME=$(aws cloudformation describe-stacks \
            --stack-name "$SHARED_STACK_NAME" \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='ObservatoryMetricsTableName'].OutputValue" \
            --output text 2>/dev/null)

          TABLE_ARN=$(aws cloudformation describe-stacks \
            --stack-name "$SHARED_STACK_NAME" \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='ObservatoryMetricsTableArn'].OutputValue" \
            --output text 2>/dev/null)

          if [ -z "$TABLE_NAME" ] || [ "$TABLE_NAME" = "None" ]; then
            echo "WARNING: ObservatoryMetricsTableName not found in shared stack — observability will be disabled"
            TABLE_NAME=""
          fi

          if [ -z "$TABLE_ARN" ] || [ "$TABLE_ARN" = "None" ]; then
            TABLE_ARN=""
          fi

          echo "observatory_table_name=$TABLE_NAME" >> "$GITHUB_OUTPUT"
          echo "observatory_table_arn=$TABLE_ARN"   >> "$GITHUB_OUTPUT"

          if [ -n "$TABLE_NAME" ]; then
            echo "Resolved ObservatoryMetricsTableName=$TABLE_NAME"
          fi

      # ----------------------------------------------------------------
      # 7. Resolve Memgraph parameters
      #
      #    Host IP is no longer needed at deploy time — the Lambda discovers
      #    it at runtime by querying EC2 for tag:memgraph=true.
      #
      #    Instance ID is still resolved here so step 11 can open the
      #    Bolt ingress rule on the Memgraph security group.
      #
      #    Secret ARN comes from the contextweave stack: MemgraphSecretArn.
      # ----------------------------------------------------------------
      - name: Resolve Memgraph instance and secret
        id: memgraph
        run: |
          MEMGRAPH_INSTANCE_ID=$(aws ec2 describe-instances \
            --region "$AWS_REGION" \
            --filters \
              "Name=tag:memgraph,Values=true" \
              "Name=instance-state-name,Values=running" \
            --query "Reservations[].Instances[].InstanceId | [0]" \
            --output text)

          if [ -z "$MEMGRAPH_INSTANCE_ID" ] || [ "$MEMGRAPH_INSTANCE_ID" = "None" ]; then
            echo "WARNING: No running EC2 instance with tag memgraph=true — ingress rule step will be skipped"
            MEMGRAPH_INSTANCE_ID=""
          fi

          MEMGRAPH_SECRET_ARN=$(aws cloudformation describe-stacks \
            --stack-name "$MEMGRAPH_STACK_NAME" \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='MemgraphSecretArn'].OutputValue" \
            --output text)

          if [ -z "$MEMGRAPH_SECRET_ARN" ] || [ "$MEMGRAPH_SECRET_ARN" = "None" ]; then
            MEMGRAPH_SECRET_ARN=""
          fi

          echo "memgraph_instance_id=$MEMGRAPH_INSTANCE_ID" >> "$GITHUB_OUTPUT"
          echo "memgraph_secret_arn=$MEMGRAPH_SECRET_ARN"   >> "$GITHUB_OUTPUT"

          echo "Resolved MemgraphInstanceId=$MEMGRAPH_INSTANCE_ID"

      # ----------------------------------------------------------------
      # 7b. CipherWeave token issuer — JWKS URL and issuer id
      #
      #     Missing stack or output is not fatal: the MCP endpoint then
      #     refuses CipherWeave tokens and accepts only the legacy token,
      #     exactly as before. Said loudly, because it is a degraded state.
      #     The CLI prints "None" for an absent output, which is not empty.
      # ----------------------------------------------------------------
      - name: Resolve CipherWeave token issuer
        id: cipherweave
        run: |
          OUTPUTS=$(aws cloudformation describe-stacks \
            --stack-name "$CIPHERWEAVE_STACK_NAME" \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs" \
            --output json 2>/dev/null || echo "[]")
          get() { echo "$OUTPUTS" | jq -r --arg k "$1" '.[]? | select(.OutputKey==$k) | .OutputValue'; }
          JWKS_URL=$(get IssuerJwksUrl)
          ISSUER_ID=$(get IssuerId)
          [ "$JWKS_URL" = "None" ] && JWKS_URL=""
          [ "$ISSUER_ID" = "None" ] && ISSUER_ID=""
          if [ -z "$JWKS_URL" ]; then
            echo "::warning title=CipherWeave tokens disabled::No IssuerJwksUrl output on $CIPHERWEAVE_STACK_NAME. /mcp accepts only the legacy static token."
          fi
          if [ -z "$JWKS_URL" ] && [ "$ACCEPT_LEGACY_TOKEN" != "true" ]; then
            echo "::error::ACCEPT_LEGACY_TOKEN is $ACCEPT_LEGACY_TOKEN and there is no CipherWeave JWKS URL: /mcp would accept no token at all."
            exit 1
          fi
          # Take the JWKS now, on the runner, so /mcp needs no network call to
          # verify (the function's VPC reaches the internet only through the
          # NAT instance). Public keys only. A failed download is a warning:
          # the URL is still passed, and the function fetches at runtime.
          JWKS_B64=""
          if [ -n "$JWKS_URL" ]; then
            if JWKS_BODY=$(curl -sS --fail --max-time 15 "$JWKS_URL"); then
              JWKS_MIN=$(printf '%s' "$JWKS_BODY" | jq -c '{keys: [.keys[]? | select(.kty == "EC" and .crv == "P-256" and (has("d") | not)) | {kid, kty, crv, x, y, use, alg}]}')
              if [ "$(printf '%s' "$JWKS_MIN" | jq '.keys | length')" -gt 0 ]; then
                JWKS_B64=$(printf '%s' "$JWKS_MIN" | base64 -w0)
                echo "Deploy-time JWKS: $(printf '%s' "$JWKS_MIN" | jq -r '[.keys[].kid] | join(", ")')"
              else
                echo "::warning::$JWKS_URL has no ES256 key; /mcp will fetch the JWKS at runtime."
              fi
            else
              echo "::warning::Could not download $JWKS_URL; /mcp will fetch the JWKS at runtime."
            fi
          fi
          echo "jwks_b64=$JWKS_B64" >> "$GITHUB_OUTPUT"
          echo "jwks_url=$JWKS_URL"                              >> "$GITHUB_OUTPUT"
          echo "issuer_id=${ISSUER_ID:-urn:cipherweave:prod}"    >> "$GITHUB_OUTPUT"
          echo "CipherWeave JWKS: ${JWKS_URL:-(none)}  legacy token accepted: $ACCEPT_LEGACY_TOKEN"

      # ----------------------------------------------------------------
      # 8. Validate SAM template
      # ----------------------------------------------------------------
      - name: Validate SAM template
        run: sam validate --region "$AWS_REGION"

      # ----------------------------------------------------------------
      # 9. SAM build
      # ----------------------------------------------------------------
      - name: SAM build
        run: |
          sam build \
            --use-container \
            --parallel

      # ----------------------------------------------------------------
      # 10. SAM deploy — passes all cross-stack resolved parameters
      #
      #     LambdaPublicSubnetIds must be overwritten with an empty value
      #     on every deploy. Omitting it on stack update keeps the previous
      #     subnet list. SAM CLI rejects a bare LambdaPublicSubnetIds=
      #     (CfnParameterOverridesType requires a non-empty unquoted value).
      #     The form it accepts is ParameterKey=...,ParameterValue="".
      #     LambdaUsePublicSubnets=false keeps HasPublicSubnets false, so
      #     VpcConfig SubnetIds stays on LambdaSubnetIds even if a list is
      #     still stored. Public subnets have no DynamoDB/AWS-service
      #     egress and need NAT or endpoints.
      #
      #     EeroPollSchedule contains a space. CfnParameterOverridesType
      #     (aws-sam-cli 1.121.0) splits an unquoted value on that space, so
      #     shell quotes around the whole Key=value are not enough: bash
      #     removes them and SAM stores rate(5. The quotes have to be inside
      #     the argv SAM receives: EeroPollSchedule="rate(5 minutes)".
      # ----------------------------------------------------------------
      - name: SAM deploy
        env:
          ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
        run: |
          # An empty value needs the ParameterKey= form (see note above).
          # Ops alerts go to the repository variable ALERT_EMAIL; unset keeps
          # the topic and alarm with no email subscription.
          if [ -n "$ALERT_EMAIL" ]; then
            ALERT_ARG="AlertEmail=$ALERT_EMAIL"
          else
            ALERT_ARG='ParameterKey=AlertEmail,ParameterValue=""'
          fi
          JWKS_URL="${{ steps.cipherweave.outputs.jwks_url }}"
          JWKS_B64="${{ steps.cipherweave.outputs.jwks_b64 }}"
          if [ -n "$JWKS_B64" ]; then
            JWKS_JSON_ARG="CipherWeaveJwks=$JWKS_B64"
          else
            JWKS_JSON_ARG='ParameterKey=CipherWeaveJwks,ParameterValue=""'
          fi
          if [ -n "$JWKS_URL" ]; then
            JWKS_ARG="CipherWeaveJwksUrl=$JWKS_URL"
          else
            JWKS_ARG='ParameterKey=CipherWeaveJwksUrl,ParameterValue=""'
          fi
          sam deploy \
            --stack-name "$STACK_NAME" \
            --capabilities CAPABILITY_IAM \
            --region "$AWS_REGION" \
            --resolve-s3 \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              StageName="$STAGE" \
              VpcId="${{ steps.vpc.outputs.vpc_id }}" \
              "LambdaSubnetIds=${{ steps.vpc.outputs.subnet_ids }}" \
              'ParameterKey=LambdaPublicSubnetIds,ParameterValue=""' \
              LambdaUsePublicSubnets=false \
              "LambdaIpv6DualStack=${{ steps.dualstack.outputs.dual_stack || 'false' }}" \
              AgentProvider=gemini \
              LLMProvider=gemini \
              GeminiModelId=gemini-3.8-flash \
              ObservatoryMetricsTableName="${{ steps.observatory.outputs.observatory_table_name }}" \
              MemgraphSecretArn="${{ steps.memgraph.outputs.memgraph_secret_arn }}" \
              EeroSessionSecretName=deviceweave/eero-session \
              'EeroPollSchedule="rate(5 minutes)"' \
              EeroAwayMissThreshold=3 \
              EeroDeviceHmacSecretName=deviceweave/eero-device-hmac \
              "$JWKS_ARG" \
              "$JWKS_JSON_ARG" \
              "CipherWeaveIssuer=${{ steps.cipherweave.outputs.issuer_id }}" \
              "AcceptLegacyToken=${ACCEPT_LEGACY_TOKEN:-true}" \
              "ToolScopeMode=$([ "${TOOL_SCOPE_MODE}" = audit ] && echo audit || echo enforce)" \
              "RestAuthMode=$([ "${REST_AUTH_MODE}" = audit ] && echo audit || echo enforce)" \
              "$ALERT_ARG" \
            --tags repo=DeviceWeave
          # repo=<RepoName> on the stack is copied onto every resource it
          # creates, so Cost Explorer splits the bill by repository; the
          # Bedrock profiles carry the same tag (ModelWeave scripts/weave_costs.py).
          # Gemini calls are billed by Google and are not on this bill.

      # ----------------------------------------------------------------
      # 11. Open Memgraph Bolt ingress from the new Lambda SG
      #
      #     After deploy, the Lambda SG ID is known. Add it as an ingress
      #     rule on the Memgraph instance's SG so Lambda can reach port 7687.
      #     This step is idempotent — it is a no-op if the rule already exists.
      # ----------------------------------------------------------------
      - name: Allow Lambda SG ingress on Memgraph port 7687
        if: ${{ steps.memgraph.outputs.memgraph_instance_id != '' }}
        run: |
          # Get the Lambda SG just created by the deploy
          LAMBDA_SG=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='LambdaSecurityGroupId'].OutputValue" \
            --output text)

          # Find the Memgraph instance's primary security group
          MEMGRAPH_HOST="${{ steps.memgraph.outputs.memgraph_host }}"
          MEMGRAPH_INSTANCE_ID="${{ steps.memgraph.outputs.memgraph_instance_id }}"
          MEMGRAPH_SG=$(aws ec2 describe-instances \
            --region "$AWS_REGION" \
            --instance-ids "$MEMGRAPH_INSTANCE_ID" \
            --query "Reservations[0].Instances[0].SecurityGroups[0].GroupId" \
            --output text)

          if [ -z "$MEMGRAPH_SG" ] || [ "$MEMGRAPH_SG" = "None" ]; then
            echo "WARNING: Could not find Memgraph instance security group — add ingress rule manually"
            echo "  Source SG: $LAMBDA_SG  Port: 7687  Target SG: (Memgraph instance SG)"
            exit 0
          fi

          # Add ingress rule — fails gracefully if the rule already exists
          aws ec2 authorize-security-group-ingress \
            --region "$AWS_REGION" \
            --group-id "$MEMGRAPH_SG" \
            --protocol tcp \
            --port 7687 \
            --source-group "$LAMBDA_SG" \
            --tag-specifications "ResourceType=security-group-rule,Tags=[{Key=Name,Value=deviceweave-lambda-memgraph-bolt}]" \
          || echo "Ingress rule already exists — skipping"

          echo "Memgraph SG $MEMGRAPH_SG ← Lambda SG $LAMBDA_SG :7687"

      # ----------------------------------------------------------------
      # 12. Print stack outputs
      # ----------------------------------------------------------------
      - name: Print stack outputs
        run: |
          aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs" \
            --output table
