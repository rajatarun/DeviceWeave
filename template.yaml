AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: DeviceWeave IoT Pay-Per-Request Execution System

Globals:
  Function:
    Runtime: python3.12
    Timeout: 30
    MemorySize: 256
    Environment:
      Variables:
        LOG_LEVEL: INFO
        # The REST routes take the /mcp credential (rest_auth.py), so every
        # function that serves one needs the verifier's settings. The legacy
        # secret is readable only by the functions granted it below.
        MCP_AUTH_TOKEN_SECRET_NAME: !Ref McpAuthTokenSecretName
        CIPHERWEAVE_JWKS_URL: !Ref CipherWeaveJwksUrl
        CIPHERWEAVE_JWKS: !Ref CipherWeaveJwks
        CIPHERWEAVE_ISSUER: !Ref CipherWeaveIssuer
        ACCEPT_LEGACY_TOKEN: !Ref AcceptLegacyToken
        LEGACY_TOKEN_SCOPES: !Ref LegacyTokenScopes
        REST_AUTH_MODE: !Ref RestAuthMode
        BEDROCK_PROFILE_ARNS: !Sub '{"us.anthropic.claude-haiku-4-5-20251001-v1:0": "${BedrockProfileClaudeHaiku45.InferenceProfileArn}", "us.amazon.nova-pro-v1:0": "${BedrockProfileNovaPro.InferenceProfileArn}", "us.meta.llama3-3-70b-instruct-v1:0": "${BedrockProfileLlama3370B.InferenceProfileArn}"}'
        BEDROCK_COST_ATTRIBUTION: !Ref BedrockCostAttribution
        LEARNING_TABLE_NAME: !Ref LearningTable
        LEARNING_CONFIDENCE_THRESHOLD: "0.85"
        # 0.4 is a testing default; 0.70 is the recommended production value.
        # Each gate can be set independently — an unset per-gate variable falls
        # back to CONFIDENCE_THRESHOLD.
        CONFIDENCE_THRESHOLD: !Ref ConfidenceThreshold
        SCENE_CONFIDENCE_THRESHOLD: !Ref SceneConfidenceThreshold
        DEVICE_CONFIDENCE_THRESHOLD: !Ref DeviceConfidenceThreshold
        LLM_CONFIDENCE_THRESHOLD: !Ref LlmConfidenceThreshold
        DEVICE_REGISTRY_TABLE: !Ref DeviceRegistryTable
        POLICY_TABLE_NAME: !Ref PolicyTable
        POLICY_CONFIDENCE_THRESHOLD: "0.85"
        PRESENCE_TABLE_NAME: !Ref PresenceTable
        SCENE_TABLE_NAME: !Ref SceneTable
        CONVERSATION_TABLE_NAME: !Ref ConversationTable
        OBSERVATORY_METRICS_TABLE: !Ref ObservatoryMetricsTableName
        OBSERVATORY_MAX_COST_USD: !Ref ObservatoryMaxCostUsd
        OBSERVATORY_MAX_LATENCY_MS: !Ref ObservatoryMaxLatencyMs
        # Input-size ceiling for mcp-observatory's scoring paths (>=0.3.0).
        # The wrapper API DeviceWeave uses does not consult it, so this is
        # inert today — it is set explicitly because a Converse payload
        # (~1.5 KB system prompt + ~4.4 KB toolConfig + up to 10 rounds of
        # history and device-roster tool results) passes the library's
        # 10 KB default within the first tool round, and any future move to
        # the interceptor / propose-commit paths would then silently
        # short-circuit every conversation to input_too_large.
        MCP_OBSERVATORY_MAX_INPUT_BYTES: "65536"
        LLM_PROVIDER: !Ref LLMProvider
        LLM_MODEL_ID: !Ref LLMModelId
        GEMINI_MODEL: !Ref GeminiModelId
        GEMINI_SECRET_NAME: "gemini/api_key"
        AGENT_PROVIDER: !Ref AgentProvider
        OLLAMA_BASE_URL: ""
        OLLAMA_MODEL: "mistral"
        KASA_SECRET_ARN: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:deviceweave/kasa-credentials"
        SWITCHBOT_SECRET_ARN: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:deviceweave/switchbot-credentials"
        GOVEE_SECRET_ARN: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:deviceweave/govee-credentials"
        RING_SECRET_ARN: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:deviceweave/ring-credentials"
        MYQ_SECRET_ARN: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:deviceweave/myq-credentials"
        WYZE_SECRET_ARN: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:deviceweave/wyze-credentials"
        MEMGRAPH_PORT: !Ref MemgraphPort
        MEMGRAPH_SECRET_ARN: !Ref MemgraphSecretArn
        WEATHER_LAT: !Ref WeatherLat
        WEATHER_LON: !Ref WeatherLon

Parameters:
  BedrockCostAttribution:
    Type: String
    Default: 'on'
    AllowedValues: ['on', 'off']
    Description: >
      Send Bedrock calls through this stack's application inference profiles,
      tagged repo=<RepoName>, so model spend is billed to this repository
      (bedrock_cost.py). 'off' calls the model ids directly, unattributed.

  StageName:
    Type: String
    Default: prod
    AllowedValues:
      - prod
      - staging
      - dev

  # -----------------------------------------------------------------------
  # VPC — resolved from the shared infrastructure stack by GitHub Actions
  # -----------------------------------------------------------------------
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: >
      VPC ID containing the Lambda subnets and Memgraph instance.
      Derived from the shared infrastructure stack (tarun-teamweave-shared).

  LambdaSubnetIds:
    Type: CommaDelimitedList
    Description: >
      Comma-separated private subnet IDs for Lambda VPC placement.
      From shared stack output LambdaSubnetIds
      (e.g. subnet-01714c0c1b4590e4e,subnet-0a3a13a3a3b5105cd).

  LambdaPublicSubnetIds:
    Type: CommaDelimitedList
    Description: >
      Optional override of LambdaSubnetIds for every function. Leave this
      empty (the default) so Lambdas stay in the private subnets. Public
      subnets have no DynamoDB/AWS-service egress and need NAT or
      endpoints: a Lambda ENI is not assigned a public IP, so an internet
      gateway route does not provide egress, and the DynamoDB gateway
      endpoint is on the private route table only. A non-empty list is
      ignored unless LambdaUsePublicSubnets is also "true". sam deploy
      must pass an empty value as
      ParameterKey=LambdaPublicSubnetIds,ParameterValue="" — a bare
      LambdaPublicSubnetIds= is rejected, and omitting the parameter on
      stack update keeps any previously stored subnet IDs.
    Default: ""

  LambdaUsePublicSubnets:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "false"
    Description: >
      Set to "true" only to place every Lambda in LambdaPublicSubnetIds.
      Leave "false" (the default) so functions stay in LambdaSubnetIds.
      Public subnets have no DynamoDB/AWS-service egress and need NAT or
      endpoints. Do not enable this for default-VPC public subnets.

  LambdaIpv6DualStack:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "true"
    Description: >
      Set Ipv6AllowedForDualStack on every function's VpcConfig. Lambda
      rejects it unless every subnet the function uses has an IPv6 CIDR,
      so the deploy workflow passes "false" (with a warning) when one does not.

  # -----------------------------------------------------------------------
  # Confidence thresholds — one gate each, all defaulting to
  # CONFIDENCE_THRESHOLD when left blank.
  #
  # 0.4 is a TESTING default: it is permissive, which is useful while a device
  # catalog is still being trained and a strict gate would reject most
  # commands. 0.70 is the RECOMMENDED PRODUCTION setting for all three — these
  # gates decide whether to actuate physical hardware, and there is no undo.
  # -----------------------------------------------------------------------
  ConfidenceThreshold:
    Type: String
    Default: "0.4"
    Description: >
      Base confidence threshold, used by any gate whose own variable is blank.
      Testing default 0.4; recommended production value 0.70.

  SceneConfidenceThreshold:
    Type: String
    Default: ""
    Description: >
      Threshold for scene resolution (a scene fires several devices at once).
      Blank inherits ConfidenceThreshold. Recommended production value: 0.70.

  DeviceConfidenceThreshold:
    Type: String
    Default: ""
    Description: >
      Threshold for tier-1 device resolution (TF cosine + behaviour score).
      Blank inherits ConfidenceThreshold. Recommended production value: 0.70.

  LlmConfidenceThreshold:
    Type: String
    Default: ""
    Description: >
      Threshold for the tier-2 LLM resolver's self-reported confidence.
      Blank inherits ConfidenceThreshold. Recommended production value: 0.70.

  # -----------------------------------------------------------------------
  # LLM Provider Configuration
  # -----------------------------------------------------------------------
  LLMProvider:
    Type: String
    Default: "gemini"
    AllowedValues:
      - "auto"
      - "bedrock"
      - "gemini"
      - "ollama"
    Description: >
      LLM provider for non-agentic calls (llm_resolver, policy authoring, etc).
      - auto: Bedrock if internet reachable, else Gemini
      - bedrock: Always use Bedrock (requires internet for cross-region inference)
      - gemini: Always use Gemini (requires GEMINI_SECRET_NAME set in Secrets Manager)
      - ollama: Local Ollama instance (dev/offline use)
      Note: bedrock_agent.py always uses Bedrock Converse API for native tool support.

  LLMModelId:
    Type: String
    Default: "us.anthropic.claude-haiku-4-5-20251001-v1:0"
    Description: >
      Bedrock cross-region inference profile for Claude Haiku.
      Only used when LLMProvider includes Bedrock (auto, bedrock).

  GeminiModelId:
    Type: String
    Default: "gemini-3.8-flash"
    Description: >
      Gemini model ID for non-live generateContent calls (e.g., gemini-3.8-flash).
      Only used when LLMProvider includes Gemini (auto, gemini).

  AgentProvider:
    Type: String
    Default: "auto"
    AllowedValues:
      - "auto"
      - "bedrock"
      - "gemini"
    Description: >
      Conversational agent provider for SMS and chat interactions.
      - auto: Bedrock if internet reachable, else Gemini
      - bedrock: Always use Bedrock Converse API (requires internet)
      - gemini: Always use Gemini generate_content API (requires GEMINI_SECRET_NAME)
      Note: Non-agentic LLM calls (llm_resolver, policy authoring) use LLMProvider.

  # -----------------------------------------------------------------------
  # Observatory — MCP Observatory metrics telemetry (optional)
  # DynamoDB table name from shared infrastructure stack.
  # -----------------------------------------------------------------------
  ObservatoryMetricsTableName:
    Type: String
    Description: >
      DynamoDB table name for MCP Observatory telemetry (optional).
      From shared stack output ObservatoryMetricsTableName.
      Leave blank to disable observability instrumentation.
    Default: ""

  ObservatoryMaxCostUsd:
    Type: String
    Default: "5.00"
    Description: >
      Per-invocation cost budget for the mcp-observatory gate, in USD.
      Exceeding it yields a REVIEW verdict, which observatory_wrapper.py
      refuses — the Converse response is discarded and the agent turn fails
      rather than actuating a device.

      Deliberately set well above the library default of 0.25 because the
      figure being compared is the library's own ESTIMATE from its built-in
      price table, which has no entry for the Claude Haiku models this
      deployment uses — it is not a Bedrock-billed amount.  Gating device
      actuation on a mis-estimated cost would refuse correct calls for a
      reason unrelated to safety.  Treat this as a runaway-loop backstop,
      not a budget, until the price table covers the model in use.

  ObservatoryMaxLatencyMs:
    Type: String
    Default: "30000"
    Description: >
      Per-invocation latency budget for the mcp-observatory gate, in
      milliseconds.  Same refusal semantics as ObservatoryMaxCostUsd — a
      Converse round slower than this is refused and the device is not
      actuated.

      Raised from the library default of 8000.  An 8-second Converse round
      is ordinary here, not pathological: the agentic loop carries a device
      roster in toolConfig and runs up to ten rounds of history, so the
      library default would refuse slow-but-correct calls and leave a user
      pressing a switch that does nothing.  Latency is a liveness signal,
      not a safety one — a slow answer is not a wrong answer — so the budget
      is set to catch a hung call rather than a merely slow one.

  # -----------------------------------------------------------------------
  # Memgraph — host is discovered at Lambda runtime via EC2 tag memgraph=true.
  # Only the port and secret ARN are supplied at deploy time.
  # -----------------------------------------------------------------------
  MemgraphPort:
    Type: Number
    Description: Memgraph Bolt port (default 7687).
    Default: 7687

  MemgraphSecretArn:
    Type: String
    Description: >
      Secrets Manager ARN for Memgraph credentials {"username","password"}.
      From contextweave-rag-prod stack output MemgraphSecretArn.
    Default: ""

  # -----------------------------------------------------------------------
  # AWS End User Messaging SMS (replaced Amazon Pinpoint SMS).
  # Phone numbers cannot be provisioned by CloudFormation; request one in
  # the End User Messaging console then supply the E.164 number here.
  # Leave EumOriginationNumber blank to deploy without SMS support.
  # -----------------------------------------------------------------------
  EumOriginationNumber:
    Type: String
    Default: ""
    Description: >
      E.164 phone number leased from AWS End User Messaging (e.g. +14155550100).
      Provision via End User Messaging console → Phone numbers → Request.
      After provisioning, enable two-way SMS and point it at SmsInboundTopic ARN.

  # -----------------------------------------------------------------------
  # Weather — Open-Meteo (free, no API key).  Set to your deployment location.
  # -----------------------------------------------------------------------
  WeatherLat:
    Type: String
    Default: "33.1962097"
    Description: Latitude for Open-Meteo weather lookups (Plano, TX).

  WeatherLon:
    Type: String
    Default: "-96.5158954"
    Description: Longitude for Open-Meteo weather lookups (Plano, TX).

  # -----------------------------------------------------------------------
  # MCP — bearer token for POST /mcp and GET /mcp.
  # The secret value is created out of band and is not stored in this template.
  # -----------------------------------------------------------------------
  McpAuthTokenSecretName:
    Type: String
    Default: deviceweave/mcp-auth-token
    AllowedPattern: "[A-Za-z0-9/_+=.@-]+"
    Description: >
      Secrets Manager secret name whose SecretString is the bearer token
      required on /mcp. Create it before calling the endpoint, for example
      aws secretsmanager create-secret --name deviceweave/mcp-auth-token
      --secret-string "$(openssl rand -hex 32)". Do not put the token in
      this template or in a deploy parameter.

  # -----------------------------------------------------------------------
  # MCP — CipherWeave access tokens (ES256 JWT, aud=deviceweave). The deploy
  # workflow reads the JWKS URL from the CipherWeave stack. Empty means
  # CipherWeave tokens are refused and only the legacy token above works.
  # -----------------------------------------------------------------------
  CipherWeaveJwksUrl:
    Type: String
    Default: ""
    AllowedPattern: "^$|^https://[^\\s]+$"
    Description: >
      IssuerJwksUrl output of the CipherWeave stack. Public keys only; it is
      not a secret.

  CipherWeaveJwks:
    Type: String
    Default: ""
    MaxLength: 4096
    AllowedPattern: "^[A-Za-z0-9+/=]*$"
    Description: >
      The CipherWeave JWKS itself (base64 of the JSON), downloaded by the deploy
      workflow on the runner. /mcp verifies against it with no network call;
      CipherWeaveJwksUrl is then only the fallback for a key id it lacks.
      Public keys only; not a secret.

  CipherWeaveIssuer:
    Type: String
    Default: "urn:cipherweave:prod"
    Description: The iss a CipherWeave token must carry (IssuerId output).

  AcceptLegacyToken:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >
      Also accept the static bearer token from McpAuthTokenSecretName during
      the move to CipherWeave tokens. Set false once every caller uses
      CipherWeave; the static secret is then never read and can be deleted.

  ToolScopeMode:
    Type: String
    Default: "enforce"
    AllowedValues: ["enforce", "audit"]
    Description: >
      enforce: each MCP tool needs its scope (read, execute, destructive) in
      the CipherWeave token. audit: scope failures are logged, not refused --
      only while granting scopes to existing clients (issuer_admin.py
      set-scopes). Step-up (60 s, single-use jti) for destructive tools and
      unlock/open is enforced in both modes.

  RestAuthMode:
    Type: String
    Default: "enforce"
    AllowedValues: ["enforce", "audit"]
    Description: >
      enforce: every REST route but GET /health needs the /mcp credential and
      the route's scope. audit: read and execute routes log what would be
      refused and run anyway, while REST clients are given a token.
      Destructive routes are enforced in both modes.

  LegacyTokenScopes:
    Type: String
    Default: "read execute destructive"
    Description: >
      Scopes the static legacy token carries while AcceptLegacyToken is true.
      Whatever this says, the legacy token can never step up, so it cannot
      delete, ingest, unlock or open.

  # -----------------------------------------------------------------------
  # Eero presence — unofficial cloud API, polled by a Lambda outside the VPC.
  # The secret name must not be blank: an empty override is rejected by
  # AllowedPattern and MinLength, which is the failure mode that broke
  # earlier deploys (a bare Parameter= with an empty value).
  # -----------------------------------------------------------------------
  EeroSessionSecretName:
    Type: String
    Default: deviceweave/eero-session
    MinLength: 1
    AllowedPattern: "[A-Za-z0-9/_+=.@-]+"
    Description: >
      Secrets Manager name of the eero session token written by
      scripts/eero_login.py. The poller may call GetSecretValue on this
      secret only. Do not put the token in this template. Must not be blank.

  EeroPollSchedule:
    Type: String
    Default: "rate(5 minutes)"
    AllowedPattern: 'rate\([1-9][0-9]* (minute|minutes|hour|hours|day|days)\)|cron\([^)]+\)'
    Description: >
      EventBridge Scheduler expression for the eero presence poll.
      Default is every 5 minutes. Must not be blank.

  EeroAwayMissThreshold:
    Type: Number
    Default: 3
    MinValue: 1
    MaxValue: 30
    Description: >
      Consecutive polls that must miss every device mapped to a person
      before that person is marked away. Arrival is immediate.

  EeroNetworkId:
    Type: String
    Default: ""
    AllowedPattern: "[0-9]*"
    Description: >
      Optional eero network id. Blank polls every network on the account.

  EeroDeviceHmacSecretName:
    Type: String
    Default: deviceweave/eero-device-hmac
    MinLength: 1
    AllowedPattern: "[A-Za-z0-9/_+=.@-]+"
    Description: >
      Secrets Manager name of the HMAC key used to hash device identifiers
      before they are written to room fingerprints or presence. This is not
      the eero session token. Must not be blank. Create the secret before
      calibrating a room. Do not put the key in this template.

  AlertEmail:
    Type: String
    Default: ""
    Description: >
      Address subscribed to the ops alerts topic (error lines in any function
      log). Empty: the topic and alarm exist, with no email subscription. Set
      with the repository variable ALERT_EMAIL.

Resources:
  # One application inference profile per model this stack's calls can resolve
  # to. A call through it is billed with its tags, so model spend lands under
  # repo=DeviceWeave in Cost Explorer beside the rest of the stack (bedrock_cost.py).
  # A profile costs nothing by itself.
  BedrockProfileClaudeHaiku45:
    Type: AWS::Bedrock::ApplicationInferenceProfile
    Properties:
      InferenceProfileName: !Sub ${AWS::StackName}-claude-haiku-4-5
      Description: us.anthropic.claude-haiku-4-5-20251001-v1:0 billed to DeviceWeave
      ModelSource:
        CopyFrom: !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/us.anthropic.claude-haiku-4-5-20251001-v1:0
      Tags:
        - Key: repo
          Value: DeviceWeave

  BedrockProfileNovaPro:
    Type: AWS::Bedrock::ApplicationInferenceProfile
    Properties:
      InferenceProfileName: !Sub ${AWS::StackName}-nova-pro
      Description: us.amazon.nova-pro-v1:0 billed to DeviceWeave
      ModelSource:
        CopyFrom: !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/us.amazon.nova-pro-v1:0
      Tags:
        - Key: repo
          Value: DeviceWeave

  BedrockProfileLlama3370B:
    Type: AWS::Bedrock::ApplicationInferenceProfile
    Properties:
      InferenceProfileName: !Sub ${AWS::StackName}-llama3-3-70b
      Description: us.meta.llama3-3-70b-instruct-v1:0 billed to DeviceWeave
      ModelSource:
        CopyFrom: !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/us.meta.llama3-3-70b-instruct-v1:0
      Tags:
        - Key: repo
          Value: DeviceWeave

  # -------------------------------------------------------------------
  # Lambda Security Group
  # Egress: Bolt (7687) to Memgraph + HTTPS (443) to cloud APIs / AWS
  # -------------------------------------------------------------------
  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "DeviceWeave Lambda SG ${StageName}"
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 7687
          ToPort: 7687
          CidrIp: 0.0.0.0/0
          Description: Memgraph Bolt (outbound to private subnet)
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS to cloud APIs and AWS services
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIpv6: "::/0"
          Description: HTTPS IPv6 egress
      Tags:
        - Key: Name
          Value: !Sub "deviceweave-lambda-sg-${StageName}"

  # -------------------------------------------------------------------
  # HTTP API (API Gateway v2)
  # -------------------------------------------------------------------
  DeviceWeaveApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref StageName
      CorsConfiguration:
        AllowMethods:
          - POST
          - GET
          - PUT
          - DELETE
        AllowHeaders:
          - Content-Type
          - Authorization
          - MCP-Protocol-Version
          - Mcp-Method
          - Mcp-Name
        AllowOrigins:
          - '*'

  # -------------------------------------------------------------------
  # Execution Lambda
  # -------------------------------------------------------------------
  DeviceWeaveFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "deviceweave-handler-${StageName}"
      CodeUri: src/
      Handler: app.handler
      Timeout: 120
      MemorySize: 1024
      Description: >
        DeviceWeave execution engine — intent parsing, scene resolution,
        semantic device matching, behavior scoring, provider execution.
      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup
        SubnetIds: !If
          - HasPublicSubnets
          - !Ref LambdaPublicSubnetIds
          - !Ref LambdaSubnetIds
        # Dual-stack: lets the function use IPv6 egress (Egress-Only IGW) for
        # AWS and third-party APIs, so it no longer depends on the NAT
        # instance for them. Requires an IPv6 CIDR on every subnet; the
        # deploy workflow checks that and passes LambdaIpv6DualStack=false
        # otherwise.
        Ipv6AllowedForDualStack: !If [LambdaDualStack, true, false]
      Policies:
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${McpAuthTokenSecretName}-*"
        - CloudWatchLogsFullAccess
        - DynamoDBCrudPolicy:
            TableName: !Ref LearningTable
        - DynamoDBCrudPolicy:
            TableName: !Ref DeviceRegistryTable
        - DynamoDBReadPolicy:
            TableName: !Ref PolicyTable
        - DynamoDBCrudPolicy:
            TableName: !Ref PresenceTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SceneTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ConversationTable
        - !If
          - HasObservatoryTable
          - Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                Resource: !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ObservatoryMetricsTableName}"
          - !Ref AWS::NoValue
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:deviceweave/kasa-credentials-*"
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:deviceweave/switchbot-credentials-*"
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:deviceweave/govee-credentials-*"
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:deviceweave/ring-credentials-*"
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:deviceweave/myq-credentials-*"
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:deviceweave/wyze-credentials-*"
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:gemini/api_key-*"
        - Statement:
            - Effect: Allow
              Action: secretsmanager:UpdateSecret
              Resource: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:deviceweave/ring-credentials-*"
        - !If
          - HasMemgraphSecret
          - AWSSecretsManagerGetSecretValuePolicy:
              SecretArn: !Ref MemgraphSecretArn
          - !Ref AWS::NoValue
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:Converse
              Resource:
                # Every candidate of ModelWeave's "reasoning" role, so the
                # model the pin names can be called (modelweave_roles).
                - "arn:aws:bedrock:*::foundation-model/anthropic.claude-haiku-4-5-20251001-v1:0"
                - "arn:aws:bedrock:*::foundation-model/amazon.nova-pro-v1:0"
                - "arn:aws:bedrock:*::foundation-model/meta.llama3-3-70b-instruct-v1:0"
                - !Sub "arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/us.anthropic.claude-haiku-4-5-20251001-v1:0"
                - !Sub "arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/us.amazon.nova-pro-v1:0"
                - !Sub "arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/us.meta.llama3-3-70b-instruct-v1:0"
                # This stack's own tagged profiles (bedrock_cost.py), and no one else's.
                - !GetAtt BedrockProfileClaudeHaiku45.InferenceProfileArn
                - !GetAtt BedrockProfileNovaPro.InferenceProfileArn
                - !GetAtt BedrockProfileLlama3370B.InferenceProfileArn
            # ModelWeave role pins: which model to call. Read only.
            - Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/modelweave/roles/*"
        - Statement:
            - Effect: Allow
              Action:
                - ec2:CreateNetworkInterface
                - ec2:DescribeNetworkInterfaces
                - ec2:DeleteNetworkInterface
                - ec2:DescribeInstances
              Resource: "*"
      Events:
        ExecuteCommand:
          Type: HttpApi
          Properties:
            ApiId: !Ref DeviceWeaveApi
            Path: /execute
            Method: POST
        LearnPhrase:
          Type: HttpApi
          Properties:
            ApiId: !Ref DeviceWeaveApi
            Path: /learn
            Method: POST
        HealthCheck:
          Type: HttpApi
          Properties:
            ApiId: !Ref DeviceWeaveApi
            Path: /health
            Method: GET
        ListProviders:
          Type: HttpApi
          Properties:
            ApiId: !Ref DeviceWeaveApi
            Path: /providers
            Method: GET
        ListDevices:
          Type: HttpApi
          Properties:
            ApiId: !Ref DeviceWeaveApi
            Path: /devices
            Method: GET
        ListScenes:
          Type: HttpApi
          Properties:
            ApiId: !Ref DeviceWeaveApi
            Path: /scenes
            Method: GET
        UpdatePresence:
          Type: HttpApi
          Properties:
            ApiId: !Ref DeviceWeaveApi
            Path: /presence
            Method: POST
        GetPresence:
          Type: HttpApi
          Properties:
            ApiId: !Ref DeviceWeaveApi
            Path: /presence
            Method: GET
        CreateDevice:
          Type: HttpApi
          Properties:
            ApiId: !Ref DeviceWeaveApi
            Path: /devices
            Method: POST
        GetDevice:
          Type: HttpApi
          Properties:
            ApiId: !Ref DeviceWeaveApi
            Path: /devices/{device_id}
            Method: GET
        UpdateDevice:
          Type: HttpApi
          Properties:
            ApiId: !Ref DeviceWeaveApi
            Path: /devices/{device_id}
            Method: PUT
        DeleteDevice:
          Type: HttpApi
          Properties:
            ApiId: !Ref DeviceWeaveApi
            Path: /devices/{device_id}
            Method: DELETE
        ListLearnings:
          Type: HttpApi
          Properties:
            ApiId: !Ref DeviceWeaveApi
            Path: /learnings
            Method: GET
        DeleteLearning:
          Type: HttpApi
          Properties:
            ApiId: !Ref DeviceWeaveApi
            Path: /learnings
            Method: DELETE
        DeleteScene:
          Type: HttpApi
          Properties:
            ApiId: !Ref DeviceWeaveApi
            Path: /scenes/{scene_id}
            Method: DELETE

  DeviceWeaveFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/deviceweave-handler-${StageName}"
      RetentionInDays: 14

  # -------------------------------------------------------------------
  # Ingestion Lambda
  # -------------------------------------------------------------------
  DeviceWeaveIngestionFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "deviceweave-ingestion-${StageName}"
      CodeUri: src/
      Handler: ingestion_handler.handler
      Timeout: 120
      Description: >
        DeviceWeave ingestion engine — cloud provider discovery (Kasa, SwitchBot,
        Govee, Ring, MyQ, Wyze), registry sync, phrase generation, behavior graph seeding.
      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup
        SubnetIds: !If
          - HasPublicSubnets
          - !Ref LambdaPublicSubnetIds
          - !Ref LambdaSubnetIds
        # Dual-stack: lets the function use IPv6 egress (Egress-Only IGW) for
        # AWS and third-party APIs, so it no longer depends on the NAT
        # instance for them. Requires an IPv6 CIDR on every subnet; the
        # deploy workflow checks that and passes LambdaIpv6DualStack=false
        # otherwise.
        Ipv6AllowedForDualStack: !If [LambdaDualStack, true, false]
      Environment:
        Variables:
          KASA_SECRET_ARN: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:deviceweave/kasa-credentials"
          SWITCHBOT_SECRET_ARN: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:deviceweave/switchbot-credentials"
          GOVEE_SECRET_ARN: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:deviceweave/govee-credentials"
          RING_SECRET_ARN: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:deviceweave/ring-credentials"
          MYQ_SECRET_ARN: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:deviceweave/myq-credentials"
          WYZE_SECRET_ARN: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:deviceweave/wyze-credentials"
          MEMGRAPH_PORT: !Ref MemgraphPort
          MEMGRAPH_SECRET_ARN: !Ref MemgraphSecretArn
      Policies:
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${McpAuthTokenSecretName}-*"
        - CloudWatchLogsFullAccess
        - DynamoDBCrudPolicy:
            TableName: !Ref DeviceRegistryTable
        - DynamoDBCrudPolicy:
            TableName: !Ref LearningTable
        - !If
          - HasObservatoryTable
          - Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                Resource: !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ObservatoryMetricsTableName}"
          - !Ref AWS::NoValue
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:deviceweave/kasa-credentials-*"
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:deviceweave/switchbot-credentials-*"
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:deviceweave/govee-credentials-*"
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:deviceweave/ring-credentials-*"
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:deviceweave/myq-credentials-*"
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:deviceweave/wyze-credentials-*"
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:gemini/api_key-*"
        - Statement:
            - Effect: Allow
              Action: secretsmanager:UpdateSecret
              Resource: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:deviceweave/ring-credentials-*"
        - !If
          - HasMemgraphSecret
          - AWSSecretsManagerGetSecretValuePolicy:
              SecretArn: !Ref MemgraphSecretArn
          - !Ref AWS::NoValue
        - Statement:
            - Effect: Allow
              Action: bedrock:InvokeModel
              Resource:
                # Every candidate of ModelWeave's "reasoning" role, so the
                # model the pin names can be called (modelweave_roles).
                - "arn:aws:bedrock:*::foundation-model/anthropic.claude-haiku-4-5-20251001-v1:0"
                - "arn:aws:bedrock:*::foundation-model/amazon.nova-pro-v1:0"
                - "arn:aws:bedrock:*::foundation-model/meta.llama3-3-70b-instruct-v1:0"
                - !Sub "arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/us.anthropic.claude-haiku-4-5-20251001-v1:0"
                - !Sub "arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/us.amazon.nova-pro-v1:0"
                - !Sub "arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/us.meta.llama3-3-70b-instruct-v1:0"
                # This stack's own tagged profiles (bedrock_cost.py), and no one else's.
                - !GetAtt BedrockProfileClaudeHaiku45.InferenceProfileArn
                - !GetAtt BedrockProfileNovaPro.InferenceProfileArn
                - !GetAtt BedrockProfileLlama3370B.InferenceProfileArn
            # ModelWeave role pins: which model to call. Read only.
            - Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/modelweave/roles/*"
        - Statement:
            - Effect: Allow
              Action:
                - ec2:CreateNetworkInterface
                - ec2:DescribeNetworkInterfaces
                - ec2:DeleteNetworkInterface
                - ec2:DescribeInstances
              Resource: "*"
      Events:
        TriggerIngest:
          Type: HttpApi
          Properties:
            ApiId: !Ref DeviceWeaveApi
            Path: /ingest
            Method: POST
        ScheduledFullSync:
          Type: Schedule
          Properties:
            Schedule: rate(24 hours)
            Name: !Sub "deviceweave-full-sync-${StageName}"
            Description: Daily full device discovery and registry reconciliation
            Input: '{"provider": "kasa", "mode": "full"}'
            Enabled: true
        ScheduledDeltaSync:
          Type: Schedule
          Properties:
            Schedule: rate(6 hours)
            Name: !Sub "deviceweave-delta-sync-${StageName}"
            Description: 6-hourly delta sync — writes only changed device records
            Input: '{"provider": "kasa", "mode": "delta"}'
            Enabled: true

  DeviceWeaveIngestionFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/deviceweave-ingestion-${StageName}"
      RetentionInDays: 14

  # -------------------------------------------------------------------
  # Eero presence poller
  # Not in the VPC: eero's cloud API is on the public internet, and the
  # private subnets only reach it through NAT. No VPC, no NAT, no
  # always-on process. EventBridge Scheduler invokes it on EeroPollSchedule.
  # -------------------------------------------------------------------
  EeroPresenceFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "deviceweave-eero-presence-${StageName}"
      CodeUri: src/
      Handler: eero_presence_handler.handler
      Timeout: 30
      MemorySize: 256
      Description: >
        Poll eero's unofficial cloud API and update home presence
        (occupancy, node/zone, signal, last_seen).
      Environment:
        Variables:
          EERO_SESSION_SECRET_NAME: !Ref EeroSessionSecretName
          EERO_TRACKED_TABLE: !Ref EeroTrackedDevicesTable
          EERO_AWAY_MISS_THRESHOLD: !Sub "${EeroAwayMissThreshold}"
          EERO_DEVICE_HMAC_SECRET_NAME: !Ref EeroDeviceHmacSecretName
          ROOM_FINGERPRINT_TABLE: !Ref RoomFingerprintTable
          ROOM_SCHEDULE_TABLE: !Ref RoomScheduleTable
          ROOM_CHECKIN_TABLE: !Ref RoomCheckinTable
          EERO_NETWORK_ID: !If
            - HasEeroNetwork
            - !Ref EeroNetworkId
            - !Ref AWS::NoValue
      Policies:
        - CloudWatchLogsFullAccess
        - DynamoDBCrudPolicy:
            TableName: !Ref PresenceTable
        - DynamoDBCrudPolicy:
            TableName: !Ref EeroTrackedDevicesTable
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${EeroSessionSecretName}-*"
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${EeroDeviceHmacSecretName}-*"
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:BatchGetItem
                - dynamodb:Query
                - dynamodb:Scan
              Resource: !GetAtt RoomFingerprintTable.Arn
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:BatchGetItem
                - dynamodb:Query
                - dynamodb:Scan
              Resource: !GetAtt RoomScheduleTable.Arn
        - Statement:
            # One PutItem per local hour. The poller cannot list or delete check-ins.
            - Effect: Allow
              Action:
                - dynamodb:PutItem
              Resource: !GetAtt RoomCheckinTable.Arn

  EeroPresenceFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/deviceweave-eero-presence-${StageName}"
      RetentionInDays: 14

  EeroPresenceScheduleRole:
    Type: AWS::IAM::Role
    Properties:
      # No RoleName. A custom name makes CreateChangeSet require
      # CAPABILITY_NAMED_IAM. CloudFormation names the role, and the
      # schedule below takes its ARN with !GetAtt.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: InvokeEeroPresence
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt EeroPresenceFunction.Arn

  EeroPresencePollSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub "deviceweave-eero-presence-${StageName}"
      Description: Poll the unofficial eero cloud API and update DeviceWeave presence
      ScheduleExpression: !Ref EeroPollSchedule
      FlexibleTimeWindow:
        Mode: "OFF"
      State: ENABLED
      Target:
        Arn: !GetAtt EeroPresenceFunction.Arn
        RoleArn: !GetAtt EeroPresenceScheduleRole.Arn
        Input: '{"source":"eero-scheduler"}'
        RetryPolicy:
          MaximumRetryAttempts: 0
          MaximumEventAgeInSeconds: 300

  # -------------------------------------------------------------------
  # Room calibration. Not in the VPC, same reason as the poller.
  # HTTP returns before the sample minute finishes; the function invokes
  # itself asynchronously to read eero. This role is the only writer of
  # the fingerprint table and the room check-in table. The poller can
  # read fingerprints and cannot read or write check-ins. The routes
  # require the MCP bearer token.
  # -------------------------------------------------------------------
  EeroCalibrationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "deviceweave-eero-calibration-${StageName}"
      CodeUri: src/
      Handler: eero_calibration_handler.handler
      Timeout: 120
      MemorySize: 256
      Description: >
        Calibrate rooms from on-demand eero reads and store node plus
        coarse signal samples. Authenticated HTTP and MCP only.
      Environment:
        Variables:
          EERO_SESSION_SECRET_NAME: !Ref EeroSessionSecretName
          EERO_DEVICE_HMAC_SECRET_NAME: !Ref EeroDeviceHmacSecretName
          EERO_TRACKED_TABLE: !Ref EeroTrackedDevicesTable
          ROOM_FINGERPRINT_TABLE: !Ref RoomFingerprintTable
          ROOM_CHECKIN_TABLE: !Ref RoomCheckinTable
          ROOM_SCHEDULE_TABLE: !Ref RoomScheduleTable
          EERO_CALIBRATION_FUNCTION_NAME: !Sub "deviceweave-eero-calibration-${StageName}"
          MCP_AUTH_TOKEN_SECRET_NAME: !Ref McpAuthTokenSecretName
          EERO_NETWORK_ID: !If
            - HasEeroNetwork
            - !Ref EeroNetworkId
            - !Ref AWS::NoValue
      Policies:
        - CloudWatchLogsFullAccess
        - DynamoDBCrudPolicy:
            TableName: !Ref RoomFingerprintTable
        - DynamoDBCrudPolicy:
            TableName: !Ref RoomCheckinTable
        - DynamoDBCrudPolicy:
            TableName: !Ref RoomScheduleTable
        - DynamoDBReadPolicy:
            TableName: !Ref EeroTrackedDevicesTable
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${EeroSessionSecretName}-*"
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${EeroDeviceHmacSecretName}-*"
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${McpAuthTokenSecretName}-*"
        - Statement:
            - Effect: Allow
              Action: lambda:InvokeFunction
              Resource:
                - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:deviceweave-eero-calibration-${StageName}"
                - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:deviceweave-eero-calibration-${StageName}:*"
      Events:
        CalibrateRoom:
          Type: HttpApi
          Properties:
            ApiId: !Ref DeviceWeaveApi
            Path: /presence/rooms/calibrate
            Method: POST
        ListRoomFingerprints:
          Type: HttpApi
          Properties:
            ApiId: !Ref DeviceWeaveApi
            Path: /presence/rooms
            Method: GET
        DeleteRoomFingerprint:
          Type: HttpApi
          Properties:
            ApiId: !Ref DeviceWeaveApi
            Path: /presence/rooms/{room}
            Method: DELETE
        RecordRoomCheckin:
          Type: HttpApi
          Properties:
            ApiId: !Ref DeviceWeaveApi
            Path: /presence/checkins
            Method: POST
        CaptureRoomReading:
          Type: HttpApi
          Properties:
            ApiId: !Ref DeviceWeaveApi
            Path: /presence/checkins/capture
            Method: POST
        LabelRoomCheckin:
          Type: HttpApi
          Properties:
            ApiId: !Ref DeviceWeaveApi
            Path: /presence/checkins/{checkin_id}/label
            Method: POST
        ListRoomCheckins:
          Type: HttpApi
          Properties:
            ApiId: !Ref DeviceWeaveApi
            Path: /presence/checkins
            Method: GET
        DeleteRoomCheckin:
          Type: HttpApi
          Properties:
            ApiId: !Ref DeviceWeaveApi
            Path: /presence/checkins/{checkin_id}
            Method: DELETE
        SetRoomSchedule:
          Type: HttpApi
          Properties:
            ApiId: !Ref DeviceWeaveApi
            Path: /presence/schedule
            Method: POST
        ListRoomSchedule:
          Type: HttpApi
          Properties:
            ApiId: !Ref DeviceWeaveApi
            Path: /presence/schedule
            Method: GET
        DeleteRoomSchedule:
          Type: HttpApi
          Properties:
            ApiId: !Ref DeviceWeaveApi
            Path: /presence/schedule/{rule_id}
            Method: DELETE

  EeroCalibrationFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/deviceweave-eero-calibration-${StageName}"
      RetentionInDays: 14

  # -------------------------------------------------------------------
  # Policy Authoring Lambda
  # Converts natural language rules → Policy DSL via Claude Sonnet,
  # validates the output, and persists valid rules to PolicyTable.
  # -------------------------------------------------------------------
  PolicyAuthoringFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "deviceweave-policy-authoring-${StageName}"
      CodeUri: src/
      Handler: policy_authoring.handler.handler
      Timeout: 60
      Description: >
        DeviceWeave policy authoring engine — natural language → LLM compiler
        → strict Policy DSL validation → DynamoDB persistence.
      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup
        SubnetIds: !If
          - HasPublicSubnets
          - !Ref LambdaPublicSubnetIds
          - !Ref LambdaSubnetIds
        # Dual-stack: lets the function use IPv6 egress (Egress-Only IGW) for
        # AWS and third-party APIs, so it no longer depends on the NAT
        # instance for them. Requires an IPv6 CIDR on every subnet; the
        # deploy workflow checks that and passes LambdaIpv6DualStack=false
        # otherwise.
        Ipv6AllowedForDualStack: !If [LambdaDualStack, true, false]
      Policies:
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${McpAuthTokenSecretName}-*"
        - CloudWatchLogsFullAccess
        - DynamoDBCrudPolicy:
            TableName: !Ref PolicyTable
        - Statement:
            - Effect: Allow
              Action: bedrock:InvokeModel
              Resource:
                # Every candidate of ModelWeave's "reasoning" role, so the
                # model the pin names can be called (modelweave_roles).
                - "arn:aws:bedrock:*::foundation-model/anthropic.claude-haiku-4-5-20251001-v1:0"
                - "arn:aws:bedrock:*::foundation-model/amazon.nova-pro-v1:0"
                - "arn:aws:bedrock:*::foundation-model/meta.llama3-3-70b-instruct-v1:0"
                - !Sub "arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/us.anthropic.claude-haiku-4-5-20251001-v1:0"
                - !Sub "arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/us.amazon.nova-pro-v1:0"
                - !Sub "arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/us.meta.llama3-3-70b-instruct-v1:0"
                # This stack's own tagged profiles (bedrock_cost.py), and no one else's.
                - !GetAtt BedrockProfileClaudeHaiku45.InferenceProfileArn
                - !GetAtt BedrockProfileNovaPro.InferenceProfileArn
                - !GetAtt BedrockProfileLlama3370B.InferenceProfileArn
            # ModelWeave role pins: which model to call. Read only.
            - Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/modelweave/roles/*"
        - Statement:
            - Effect: Allow
              Action:
                - ec2:CreateNetworkInterface
                - ec2:DescribeNetworkInterfaces
                - ec2:DeleteNetworkInterface
              Resource: "*"
      Events:
        AuthorPolicy:
          Type: HttpApi
          Properties:
            ApiId: !Ref DeviceWeaveApi
            Path: /policies/author
            Method: POST
        ListPolicies:
          Type: HttpApi
          Properties:
            ApiId: !Ref DeviceWeaveApi
            Path: /policies
            Method: GET
        GetPolicy:
          Type: HttpApi
          Properties:
            ApiId: !Ref DeviceWeaveApi
            Path: /policies/{rule_id}
            Method: GET
        DeletePolicy:
          Type: HttpApi
          Properties:
            ApiId: !Ref DeviceWeaveApi
            Path: /policies/{rule_id}
            Method: DELETE

  PolicyAuthoringFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/deviceweave-policy-authoring-${StageName}"
      RetentionInDays: 14

  # -------------------------------------------------------------------
  # MCP Lambda — Streamable HTTP at POST /mcp and GET /mcp.
  # Tools call the execution, ingestion, and policy service functions
  # in-process. The bearer token is read from Secrets Manager.
  # -------------------------------------------------------------------
  DeviceWeaveMcpFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "deviceweave-mcp-${StageName}"
      CodeUri: src/
      Handler: mcp_handler.handler
      Timeout: 120
      MemorySize: 1024
      Description: >
        DeviceWeave MCP Streamable HTTP endpoint (protocol 2026-07-28; handshake revisions via initialize).
        POST /mcp accepts JSON-RPC. GET /mcp returns 405.
      Environment:
        Variables:
          # Merged with Globals, which supply table names and provider secret ARNs.
          MCP_AUTH_TOKEN_SECRET_NAME: !Ref McpAuthTokenSecretName
          CIPHERWEAVE_JWKS_URL: !Ref CipherWeaveJwksUrl
          CIPHERWEAVE_JWKS: !Ref CipherWeaveJwks
          CIPHERWEAVE_ISSUER: !Ref CipherWeaveIssuer
          ACCEPT_LEGACY_TOKEN: !Ref AcceptLegacyToken
          CIPHERWEAVE_SCOPE_MODE: !Ref ToolScopeMode
          LEGACY_TOKEN_SCOPES: !Ref LegacyTokenScopes
          TOKEN_JTI_TABLE: !Ref TokenJtiTable
          EERO_CALIBRATION_FUNCTION_NAME: !Sub "deviceweave-eero-calibration-${StageName}"
      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup
        SubnetIds: !If
          - HasPublicSubnets
          - !Ref LambdaPublicSubnetIds
          - !Ref LambdaSubnetIds
        # Dual-stack: lets the function use IPv6 egress (Egress-Only IGW) for
        # AWS and third-party APIs, so it no longer depends on the NAT
        # instance for them. Requires an IPv6 CIDR on every subnet; the
        # deploy workflow checks that and passes LambdaIpv6DualStack=false
        # otherwise.
        Ipv6AllowedForDualStack: !If [LambdaDualStack, true, false]
      Policies:
        - CloudWatchLogsFullAccess
        - DynamoDBCrudPolicy:
            TableName: !Ref LearningTable
        - DynamoDBCrudPolicy:
            TableName: !Ref DeviceRegistryTable
        - DynamoDBCrudPolicy:
            TableName: !Ref PolicyTable
        - DynamoDBCrudPolicy:
            TableName: !Ref PresenceTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SceneTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ConversationTable
        # Step-up replay ledger: a conditional put per destructive call. No
        # read, update or delete -- a spent jti cannot be un-spent.
        - Statement:
            - Effect: Allow
              Action: dynamodb:PutItem
              Resource: !GetAtt TokenJtiTable.Arn
        - !If
          - HasObservatoryTable
          - Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                Resource: !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ObservatoryMetricsTableName}"
          - !Ref AWS::NoValue
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${McpAuthTokenSecretName}-*"
        - Statement:
            - Effect: Allow
              Action: lambda:InvokeFunction
              Resource:
                - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:deviceweave-eero-calibration-${StageName}"
                - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:deviceweave-eero-calibration-${StageName}:*"
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:deviceweave/kasa-credentials-*"
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:deviceweave/switchbot-credentials-*"
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:deviceweave/govee-credentials-*"
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:deviceweave/ring-credentials-*"
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:deviceweave/myq-credentials-*"
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:deviceweave/wyze-credentials-*"
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:gemini/api_key-*"
        - Statement:
            - Effect: Allow
              Action: secretsmanager:UpdateSecret
              Resource: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:deviceweave/ring-credentials-*"
        - !If
          - HasMemgraphSecret
          - AWSSecretsManagerGetSecretValuePolicy:
              SecretArn: !Ref MemgraphSecretArn
          - !Ref AWS::NoValue
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:Converse
              Resource:
                # Every candidate of ModelWeave's "reasoning" role, so the
                # model the pin names can be called (modelweave_roles).
                - "arn:aws:bedrock:*::foundation-model/anthropic.claude-haiku-4-5-20251001-v1:0"
                - "arn:aws:bedrock:*::foundation-model/amazon.nova-pro-v1:0"
                - "arn:aws:bedrock:*::foundation-model/meta.llama3-3-70b-instruct-v1:0"
                - !Sub "arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/us.anthropic.claude-haiku-4-5-20251001-v1:0"
                - !Sub "arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/us.amazon.nova-pro-v1:0"
                - !Sub "arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/us.meta.llama3-3-70b-instruct-v1:0"
                # This stack's own tagged profiles (bedrock_cost.py), and no one else's.
                - !GetAtt BedrockProfileClaudeHaiku45.InferenceProfileArn
                - !GetAtt BedrockProfileNovaPro.InferenceProfileArn
                - !GetAtt BedrockProfileLlama3370B.InferenceProfileArn
            # ModelWeave role pins: which model to call. Read only.
            - Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/modelweave/roles/*"
        - Statement:
            - Effect: Allow
              Action:
                - ec2:CreateNetworkInterface
                - ec2:DescribeNetworkInterfaces
                - ec2:DeleteNetworkInterface
                - ec2:DescribeInstances
              Resource: "*"
      Events:
        McpPost:
          Type: HttpApi
          Properties:
            ApiId: !Ref DeviceWeaveApi
            Path: /mcp
            Method: POST
        McpGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref DeviceWeaveApi
            Path: /mcp
            Method: GET
        # RFC 9728: where to get a token for /mcp. Unauthenticated by design.
        McpResourceMetadataGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref DeviceWeaveApi
            Path: /.well-known/oauth-protected-resource
            Method: GET

  DeviceWeaveMcpFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/deviceweave-mcp-${StageName}"
      RetentionInDays: 14

  # -------------------------------------------------------------------
  # AWS End User Messaging — two-way SMS (replaced Amazon Pinpoint SMS)
  #
  # Low-cost pattern:
  #   User SMS → EUM long code (~$1/mo) → SmsInboundTopic → Lambda
  #   Lambda → send_text_message (pinpoint-sms-voice-v2) → reply SMS
  #   (~$0.0075 per message each direction)
  #
  # One-time console step (CloudFormation cannot provision phone numbers):
  #   End User Messaging console → Phone numbers → Request phone number
  #   → enable Two-way SMS → set SNS topic to SmsInboundTopic ARN
  #   → set EumOriginationNumber parameter to the provisioned E.164 number
  # -------------------------------------------------------------------
  SmsInboundTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "deviceweave-sms-inbound-${StageName}"

  SmsInboundTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - !Ref SmsInboundTopic
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: sms-voice.amazonaws.com
            Action: sns:Publish
            Resource: !Ref SmsInboundTopic

  DeviceWeaveSmsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "deviceweave-sms-${StageName}"
      CodeUri: src/
      Handler: sms_handler.handler
      Timeout: 120
      MemorySize: 1024
      Description: >
        DeviceWeave SMS handler — receives End User Messaging inbound SMS via
        SNS, runs the conversational agent, replies via
        pinpoint-sms-voice-v2 send_text_message. Phone number is used as
        session_id for persistent per-user conversation.
      Environment:
        Variables:
          LOG_LEVEL: INFO
          EUM_ORIGINATION_NUMBER: !Ref EumOriginationNumber
          CONVERSATION_TABLE_NAME: !Ref ConversationTable
          DEVICE_REGISTRY_TABLE: !Ref DeviceRegistryTable
          LEARNING_TABLE_NAME: !Ref LearningTable
          POLICY_TABLE_NAME: !Ref PolicyTable
          PRESENCE_TABLE_NAME: !Ref PresenceTable
          SCENE_TABLE_NAME: !Ref SceneTable
          LLM_MODEL_ID: "us.anthropic.claude-haiku-4-5-20251001-v1:0"
          MEMGRAPH_PORT: !Ref MemgraphPort
          MEMGRAPH_SECRET_ARN: !Ref MemgraphSecretArn
          WEATHER_LAT: !Ref WeatherLat
          WEATHER_LON: !Ref WeatherLon
          KASA_SECRET_ARN: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:deviceweave/kasa-credentials"
          SWITCHBOT_SECRET_ARN: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:deviceweave/switchbot-credentials"
          GOVEE_SECRET_ARN: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:deviceweave/govee-credentials"
          RING_SECRET_ARN: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:deviceweave/ring-credentials"
          MYQ_SECRET_ARN: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:deviceweave/myq-credentials"
          WYZE_SECRET_ARN: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:deviceweave/wyze-credentials"
      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup
        SubnetIds: !If
          - HasPublicSubnets
          - !Ref LambdaPublicSubnetIds
          - !Ref LambdaSubnetIds
        # Dual-stack: lets the function use IPv6 egress (Egress-Only IGW) for
        # AWS and third-party APIs, so it no longer depends on the NAT
        # instance for them. Requires an IPv6 CIDR on every subnet; the
        # deploy workflow checks that and passes LambdaIpv6DualStack=false
        # otherwise.
        Ipv6AllowedForDualStack: !If [LambdaDualStack, true, false]
      Policies:
        - CloudWatchLogsFullAccess
        - DynamoDBCrudPolicy:
            TableName: !Ref ConversationTable
        - DynamoDBCrudPolicy:
            TableName: !Ref LearningTable
        - DynamoDBReadPolicy:
            TableName: !Ref DeviceRegistryTable
        - DynamoDBReadPolicy:
            TableName: !Ref PolicyTable
        - DynamoDBReadPolicy:
            TableName: !Ref PresenceTable
        - DynamoDBReadPolicy:
            TableName: !Ref SceneTable
        - !If
          - HasObservatoryTable
          - Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                Resource: !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ObservatoryMetricsTableName}"
          - !Ref AWS::NoValue
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:deviceweave/kasa-credentials-*"
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:deviceweave/switchbot-credentials-*"
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:deviceweave/govee-credentials-*"
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:deviceweave/ring-credentials-*"
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:deviceweave/myq-credentials-*"
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:deviceweave/wyze-credentials-*"
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:gemini/api_key-*"
        - !If
          - HasMemgraphSecret
          - AWSSecretsManagerGetSecretValuePolicy:
              SecretArn: !Ref MemgraphSecretArn
          - !Ref AWS::NoValue
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:Converse
              Resource:
                # Every candidate of ModelWeave's "reasoning" role, so the
                # model the pin names can be called (modelweave_roles).
                - "arn:aws:bedrock:*::foundation-model/anthropic.claude-haiku-4-5-20251001-v1:0"
                - "arn:aws:bedrock:*::foundation-model/amazon.nova-pro-v1:0"
                - "arn:aws:bedrock:*::foundation-model/meta.llama3-3-70b-instruct-v1:0"
                - !Sub "arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/us.anthropic.claude-haiku-4-5-20251001-v1:0"
                - !Sub "arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/us.amazon.nova-pro-v1:0"
                - !Sub "arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/us.meta.llama3-3-70b-instruct-v1:0"
                # This stack's own tagged profiles (bedrock_cost.py), and no one else's.
                - !GetAtt BedrockProfileClaudeHaiku45.InferenceProfileArn
                - !GetAtt BedrockProfileNovaPro.InferenceProfileArn
                - !GetAtt BedrockProfileLlama3370B.InferenceProfileArn
            # ModelWeave role pins: which model to call. Read only.
            - Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/modelweave/roles/*"
        - Statement:
            - Effect: Allow
              Action: sms-voice:SendTextMessage
              Resource: "*"
        - Statement:
            - Effect: Allow
              Action:
                - ec2:CreateNetworkInterface
                - ec2:DescribeNetworkInterfaces
                - ec2:DeleteNetworkInterface
                - ec2:DescribeInstances
              Resource: "*"
      Events:
        SmsInbound:
          Type: SNS
          Properties:
            Topic: !Ref SmsInboundTopic

  DeviceWeaveSmsFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/deviceweave-sms-${StageName}"
      RetentionInDays: 14

  # -------------------------------------------------------------------
  # Ops alerts: error lines in any function log
  #
  # Errors here are mostly caught and logged (a provider failure is a 502,
  # an expired Ring token a logged auth error), so Lambda's Errors metric
  # does not see them. Each function's log feeds one ErrorLines metric (one
  # custom metric, not one per function) and one alarm watches it. SNS
  # notifies on the change to ALARM.
  # -------------------------------------------------------------------
  OpsAlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "deviceweave-ops-alerts-${StageName}"
      KmsMasterKeyId: alias/aws/sns

  OpsAlertsEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlertEmail
    Properties:
      TopicArn: !Ref OpsAlertsTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  DeviceWeaveFunctionErrorLines:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref DeviceWeaveFunctionLogGroup
      FilterPattern: '?"[ERROR]" ?"Task timed out" ?"Runtime.ExitError"'
      MetricTransformations:
        - MetricNamespace: DeviceWeave/Ops
          MetricName: ErrorLines
          MetricValue: "1"
          Unit: Count

  DeviceWeaveIngestionFunctionErrorLines:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref DeviceWeaveIngestionFunctionLogGroup
      FilterPattern: '?"[ERROR]" ?"Task timed out" ?"Runtime.ExitError"'
      MetricTransformations:
        - MetricNamespace: DeviceWeave/Ops
          MetricName: ErrorLines
          MetricValue: "1"
          Unit: Count

  EeroPresenceFunctionErrorLines:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref EeroPresenceFunctionLogGroup
      FilterPattern: '?"[ERROR]" ?"Task timed out" ?"Runtime.ExitError"'
      MetricTransformations:
        - MetricNamespace: DeviceWeave/Ops
          MetricName: ErrorLines
          MetricValue: "1"
          Unit: Count

  EeroCalibrationFunctionErrorLines:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref EeroCalibrationFunctionLogGroup
      FilterPattern: '?"[ERROR]" ?"Task timed out" ?"Runtime.ExitError"'
      MetricTransformations:
        - MetricNamespace: DeviceWeave/Ops
          MetricName: ErrorLines
          MetricValue: "1"
          Unit: Count

  PolicyAuthoringFunctionErrorLines:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref PolicyAuthoringFunctionLogGroup
      FilterPattern: '?"[ERROR]" ?"Task timed out" ?"Runtime.ExitError"'
      MetricTransformations:
        - MetricNamespace: DeviceWeave/Ops
          MetricName: ErrorLines
          MetricValue: "1"
          Unit: Count

  DeviceWeaveMcpFunctionErrorLines:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref DeviceWeaveMcpFunctionLogGroup
      FilterPattern: '?"[ERROR]" ?"Task timed out" ?"Runtime.ExitError"'
      MetricTransformations:
        - MetricNamespace: DeviceWeave/Ops
          MetricName: ErrorLines
          MetricValue: "1"
          Unit: Count

  DeviceWeaveSmsFunctionErrorLines:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref DeviceWeaveSmsFunctionLogGroup
      FilterPattern: '?"[ERROR]" ?"Task timed out" ?"Runtime.ExitError"'
      MetricTransformations:
        - MetricNamespace: DeviceWeave/Ops
          MetricName: ErrorLines
          MetricValue: "1"
          Unit: Count

  ErrorLinesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "deviceweave-error-lines-${StageName}"
      AlarmDescription: >
        A DeviceWeave function logged an [ERROR], timed out or crashed in the
        last 5 minutes. Find it with Logs Insights over
        /aws/lambda/deviceweave-*: filter @message like /\[ERROR\]|Task timed out/.
      Namespace: DeviceWeave/Ops
      MetricName: ErrorLines
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref OpsAlertsTopic]

  # -------------------------------------------------------------------
  # DynamoDB — Phrase Learning Store
  # -------------------------------------------------------------------
  LearningTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "deviceweave-phrases-${StageName}"
      BillingMode: PAY_PER_REQUEST
      TableClass: STANDARD
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: device_id
          AttributeType: S
        - AttributeName: phrase
          AttributeType: S
      KeySchema:
        - AttributeName: device_id
          KeyType: HASH
        - AttributeName: phrase
          KeyType: RANGE

  # -------------------------------------------------------------------
  # DynamoDB — Device Registry
  # -------------------------------------------------------------------
  DeviceRegistryTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "deviceweave-registry-${StageName}"
      BillingMode: PAY_PER_REQUEST
      TableClass: STANDARD
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: device_id
          AttributeType: S
        - AttributeName: provider
          AttributeType: S
        - AttributeName: status
          AttributeType: S
      KeySchema:
        - AttributeName: device_id
          KeyType: HASH
        - AttributeName: provider
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: provider-status-index
          KeySchema:
            - AttributeName: provider
              KeyType: HASH
            - AttributeName: status
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  # -------------------------------------------------------------------
  # DynamoDB — Presence Store
  # Single-item table tracking home-occupancy state for the Policy Engine.
  # Updated via POST /presence; read by context_provider.py on each
  # /execute call.
  # -------------------------------------------------------------------
  PresenceTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "deviceweave-presence-${StageName}"
      BillingMode: PAY_PER_REQUEST
      TableClass: STANDARD
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH

  # -------------------------------------------------------------------
  # DynamoDB — eero devices mapped to people (MAC or name).
  # Written by scripts/eero_login.py track. Small, on-demand, no VPC.
  # -------------------------------------------------------------------
  EeroTrackedDevicesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "deviceweave-eero-tracked-${StageName}"
      BillingMode: PAY_PER_REQUEST
      TableClass: STANDARD
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH

  # -------------------------------------------------------------------
  # DynamoDB — room fingerprints (the calibration model).
  # On-demand, encrypted at rest, point-in-time recovery off.
  # Written only by the calibration Lambda. The poller may read it.
  # No public route reaches this table without the MCP bearer token.
  # -------------------------------------------------------------------
  RoomFingerprintTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "deviceweave-room-fingerprints-${StageName}"
      BillingMode: PAY_PER_REQUEST
      TableClass: STANDARD
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: false
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE

  # -------------------------------------------------------------------
  # DynamoDB — room check-ins (a week or more of labeled readings).
  # Pay-per-request. Encryption is the default AWS owned key.
  # No TTL: the rows are the training set. No RoleName or other
  # custom IAM name. Written only by the calibration Lambda.
  # -------------------------------------------------------------------
  RoomCheckinTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "deviceweave-room-checkins-${StageName}"
      BillingMode: PAY_PER_REQUEST
      TableClass: STANDARD
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: false
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE

  # -------------------------------------------------------------------
  # DynamoDB — fixed local-time room rules.
  # Pay-per-request. Default AWS owned encryption. No TTL.
  # CloudFormation names the role. The calibration function is the
  # only writer. The poller may read.
  # -------------------------------------------------------------------
  RoomScheduleTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "deviceweave-room-schedule-${StageName}"
      BillingMode: PAY_PER_REQUEST
      TableClass: STANDARD
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: false
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE

  # -------------------------------------------------------------------
  # DynamoDB — Policy Store
  # Stores validated Policy DSL rules with full version history.
  # -------------------------------------------------------------------
  PolicyTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "deviceweave-policies-${StageName}"
      BillingMode: PAY_PER_REQUEST
      TableClass: STANDARD
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: rule_id
          AttributeType: S
        - AttributeName: version
          AttributeType: N
        - AttributeName: device_type
          AttributeType: S
        - AttributeName: created_at
          AttributeType: S
      KeySchema:
        - AttributeName: rule_id
          KeyType: HASH
        - AttributeName: version
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: device-type-created-index
          KeySchema:
            - AttributeName: device_type
              KeyType: HASH
            - AttributeName: created_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  # -------------------------------------------------------------------
  # DynamoDB — Scene Deletion Store
  # Tracks scenes deleted via DELETE /scenes/{scene_id}.
  # The active catalog is SCENE_CATALOG minus any deleted IDs here.
  # -------------------------------------------------------------------
  SceneTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "deviceweave-scenes-${StageName}"
      BillingMode: PAY_PER_REQUEST
      TableClass: STANDARD
      AttributeDefinitions:
        - AttributeName: scene_id
          AttributeType: S
      KeySchema:
        - AttributeName: scene_id
          KeyType: HASH

  # -------------------------------------------------------------------
  # DynamoDB — Conversation Store
  # Stores Bedrock Converse API message history per session_id.
  # Items expire automatically via DynamoDB TTL (24 h).
  # -------------------------------------------------------------------
  ConversationTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "deviceweave-conversations-${StageName}"
      BillingMode: PAY_PER_REQUEST
      TableClass: STANDARD
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      AttributeDefinitions:
        - AttributeName: session_id
          AttributeType: S
      KeySchema:
        - AttributeName: session_id
          KeyType: HASH

  # jti of every CipherWeave token spent on a step-up call (delete_*, ingest,
  # unlock/open), keyed "deviceweave#<jti>". A conditional put makes each
  # fresh token single-use across every Lambda instance; TTL drops the item
  # shortly after the token would have expired anyway.
  TokenJtiTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "deviceweave-token-jti-${StageName}"
      BillingMode: PAY_PER_REQUEST
      TableClass: STANDARD
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      AttributeDefinitions:
        - AttributeName: jti
          AttributeType: S
      KeySchema:
        - AttributeName: jti
          KeyType: HASH

Conditions:
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, ""]]
  HasObservatoryTable: !Not [!Equals [!Ref ObservatoryMetricsTableName, ""]]
  HasMemgraphSecret: !Not [!Equals [!Ref MemgraphSecretArn, ""]]
  # A non-empty LambdaPublicSubnetIds used to replace the private subnets
  # on its own. That path is not safe: public subnets have no
  # DynamoDB/AWS-service egress and need NAT or endpoints. Both the list
  # and an explicit LambdaUsePublicSubnets=true are required. The default
  # (empty list, flag false) keeps LambdaSubnetIds. Deploys overwrite a
  # stored list with ParameterValue="" ; HasPublicSubnets stays false, so
  # VpcConfig SubnetIds never receives that empty value.
  HasPublicSubnets: !And
    - !Not [!Equals [!Join ["", !Ref LambdaPublicSubnetIds], ""]]
    - !Equals [!Ref LambdaUsePublicSubnets, "true"]
  LambdaDualStack: !Equals [!Ref LambdaIpv6DualStack, "true"]
  HasEeroNetwork: !Not [!Equals [!Ref EeroNetworkId, ""]]

Outputs:
  ApiBaseUrl:
    Description: Base URL for the DeviceWeave API
    Value: !Sub "https://${DeviceWeaveApi}.execute-api.${AWS::Region}.amazonaws.com/${StageName}"
    Export:
      Name: !Sub "DeviceWeaveApiBaseUrl-${StageName}"

  McpEndpoint:
    Description: >
      POST /mcp — MCP Streamable HTTP endpoint (protocol 2026-07-28; handshake revisions via initialize).
      Requires an Authorization header and the secret named by McpAuthTokenSecretName.
    Value: !Sub "https://${DeviceWeaveApi}.execute-api.${AWS::Region}.amazonaws.com/${StageName}/mcp"
    Export:
      Name: !Sub "DeviceWeaveMcpEndpoint-${StageName}"

  ExecuteEndpoint:
    Description: POST /execute — natural language device or scene command
    Value: !Sub "https://${DeviceWeaveApi}.execute-api.${AWS::Region}.amazonaws.com/${StageName}/execute"

  LearnEndpoint:
    Description: POST /learn — add a phrase binding to a device
    Value: !Sub "https://${DeviceWeaveApi}.execute-api.${AWS::Region}.amazonaws.com/${StageName}/learn"

  IngestEndpoint:
    Description: POST /ingest — trigger device discovery and registry sync
    Value: !Sub "https://${DeviceWeaveApi}.execute-api.${AWS::Region}.amazonaws.com/${StageName}/ingest"

  DevicesEndpoint:
    Description: GET /devices — list static device catalog
    Value: !Sub "https://${DeviceWeaveApi}.execute-api.${AWS::Region}.amazonaws.com/${StageName}/devices"

  ScenesEndpoint:
    Description: GET /scenes — list registered scenes
    Value: !Sub "https://${DeviceWeaveApi}.execute-api.${AWS::Region}.amazonaws.com/${StageName}/scenes"

  LambdaSecurityGroupId:
    Description: Lambda SG ID — add as ingress rule on Memgraph's security group (port 7687)
    Value: !Ref LambdaSecurityGroup
    Export:
      Name: !Sub "DeviceWeaveLambdaSG-${StageName}"

  LearningTableName:
    Description: DynamoDB phrase learning table
    Value: !Ref LearningTable
    Export:
      Name: !Sub "DeviceWeaveLearningTable-${StageName}"

  DeviceRegistryTableName:
    Description: DynamoDB device registry table
    Value: !Ref DeviceRegistryTable
    Export:
      Name: !Sub "DeviceWeaveRegistryTable-${StageName}"

  FunctionArn:
    Description: Execution Lambda ARN
    Value: !GetAtt DeviceWeaveFunction.Arn
    Export:
      Name: !Sub "DeviceWeaveFunctionArn-${StageName}"

  IngestionFunctionArn:
    Description: Ingestion Lambda ARN
    Value: !GetAtt DeviceWeaveIngestionFunction.Arn
    Export:
      Name: !Sub "DeviceWeaveIngestionFunctionArn-${StageName}"

  PolicyAuthoringFunctionArn:
    Description: Policy Authoring Lambda ARN
    Value: !GetAtt PolicyAuthoringFunction.Arn
    Export:
      Name: !Sub "DeviceWeavePolicyAuthoringFunctionArn-${StageName}"

  PolicyTableName:
    Description: DynamoDB policy store table
    Value: !Ref PolicyTable
    Export:
      Name: !Sub "DeviceWeavePolicyTable-${StageName}"

  AuthorPolicyEndpoint:
    Description: POST /policies/author — compile and store a natural language rule
    Value: !Sub "https://${DeviceWeaveApi}.execute-api.${AWS::Region}.amazonaws.com/${StageName}/policies/author"

  ListPoliciesEndpoint:
    Description: GET /policies — list active policies
    Value: !Sub "https://${DeviceWeaveApi}.execute-api.${AWS::Region}.amazonaws.com/${StageName}/policies"

  PresenceEndpoint:
    Description: POST /presence — update home-occupancy state for the Policy Engine
    Value: !Sub "https://${DeviceWeaveApi}.execute-api.${AWS::Region}.amazonaws.com/${StageName}/presence"

  PresenceTableName:
    Description: DynamoDB presence table (home-occupancy state)
    Value: !Ref PresenceTable
    Export:
      Name: !Sub "DeviceWeavePresenceTable-${StageName}"

  EeroTrackedDevicesTableName:
    Description: DynamoDB table of eero clients mapped to people
    Value: !Ref EeroTrackedDevicesTable
    Export:
      Name: !Sub "DeviceWeaveEeroTrackedTable-${StageName}"

  EeroPresenceFunctionArn:
    Description: Eero presence poller Lambda ARN
    Value: !GetAtt EeroPresenceFunction.Arn
    Export:
      Name: !Sub "DeviceWeaveEeroPresenceFunctionArn-${StageName}"

  RoomFingerprintTableName:
    Description: DynamoDB table of calibrated room fingerprints
    Value: !Ref RoomFingerprintTable
    Export:
      Name: !Sub "DeviceWeaveRoomFingerprintTable-${StageName}"

  RoomCheckinTableName:
    Description: DynamoDB table of labeled room check-ins
    Value: !Ref RoomCheckinTable
    Export:
      Name: !Sub "DeviceWeaveRoomCheckinTable-${StageName}"

  RoomScheduleTableName:
    Description: DynamoDB table of fixed local-time room rules
    Value: !Ref RoomScheduleTable
    Export:
      Name: !Sub "DeviceWeaveRoomScheduleTable-${StageName}"

  # The outputs below complete the set an automation harness needs to resolve
  # every coordinate from `describe-stacks` alone. scripts/stack_env.py reads
  # them; tests/test_openapi_contract.py asserts each one still exists and, for
  # the index names, that the table really defines an index by that name. An
  # output naming an index that does not exist fails at query time, not deploy
  # time, which is the worse of the two.

  DeviceRegistryProviderStatusIndex:
    Description: >
      GSI on the device registry (provider → status). The table is keyed
      (device_id, provider), so "every active device from this provider" is
      only answerable through this index — DeviceRegistryTableName on its own
      leaves a caller to scan.
    Value: provider-status-index
    Export:
      Name: !Sub "DeviceWeaveRegistryProviderStatusIndex-${StageName}"

  PolicyTableDeviceTypeCreatedIndex:
    Description: >
      GSI on the policy table (device_type → created_at), backing
      GET /policies?device_type=. The table is keyed (rule_id, version).
    Value: device-type-created-index
    Export:
      Name: !Sub "DeviceWeavePolicyDeviceTypeCreatedIndex-${StageName}"

  SceneTableName:
    Description: >
      DynamoDB scene-deletion table. Holds deletions, not scenes: the active
      catalog is SCENE_CATALOG minus the ids recorded here, so an empty table
      means every built-in scene is active.
    Value: !Ref SceneTable
    Export:
      Name: !Sub "DeviceWeaveSceneTable-${StageName}"

  ConversationTableName:
    Description: DynamoDB session-history table for conversational POST /execute
    Value: !Ref ConversationTable
    Export:
      Name: !Sub "DeviceWeaveConversationTable-${StageName}"

  OpenApiSpecPath:
    Description: >
      Repo-relative path to the OpenAPI description of this API. Its `servers`
      block is templated on ApiBaseUrl above, so a harness resolves the stack
      first and the spec second rather than hardcoding a URL.
    Value: openapi/deviceweave.yaml
